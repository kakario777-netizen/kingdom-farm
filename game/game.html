<title>말랑 왕국</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 레이아웃: 상단 HUD 한 줄 + 하늘 위 떠 있는 섬(10×6 타일, 성은 2×2) + 아래에서 올라오는 시트·대신 대화창 */
:root{
  --sky:#bfe8ff; --sky2:#eaf8ff;
  --grass:#8fd16a; --grass2:#9ad874; --grass-dot:#a9e186; --island:#6db84e; --cliff:#c48a55; --cliff2:#9c6638;
  --soil:#c0824f; --soil-line:#a86c3e;
  --cream:#fff8e8; --paper:#ffffff;
  --ink:#5a3a28; --ink-soft:#8a6a55;
  --pink:#ff6f9f; --gold:#ffc93c; --mojo:#8b6cff; --mint:#4fcfa8;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  padding-block:6px;box-sizing:border-box;gap:6px}
button{font-family:var(--font);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--mojo);outline-offset:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--paper);border:2.5px solid var(--ink);
  border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:3px 10px 3px 4px;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:22px;height:22px}
.me{padding:2px 10px 2px 2px;cursor:pointer}
.me .face{width:30px;height:30px;border-radius:50%;background:#ffe9f1;border:2px solid var(--ink);overflow:hidden}
.me .face svg{width:100%;height:100%}
.me .nm{display:flex;flex-direction:column;line-height:1.05;font-size:13px}
.me .nm small{font-size:11px;color:var(--ink-soft)}
.lvnum{background:var(--pink);color:#fff;border-radius:999px;min-width:24px;height:24px;display:grid;
  place-items:center;font-size:13px;border:2px solid var(--ink)}
.xp{width:64px;height:10px;background:#f1e4d6;border-radius:99px;overflow:hidden;border:2px solid var(--ink)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#7fe0a0,#4fcfa8);width:0;transition:width .4s}
.clock{padding-left:10px;font-size:14px}
.clock em{font-style:normal;background:var(--mojo);color:#fff;border-radius:8px;padding:0 5px;font-size:12px}
.spacer{flex:1}
.btn{background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:14px;
  box-shadow:0 4px 0 var(--ink);padding:5px 12px;font-size:15px;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.y{background:var(--gold);color:var(--ink)}
.btn.w{background:var(--paper);color:var(--ink)}
.btn.m{background:var(--mojo)}
.btn.g{background:var(--mint);color:var(--ink)}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.btn.big{font-size:20px;padding:8px 26px;border-radius:18px}

/* 무대: 하늘 + 캔버스(떠 있는 섬) */
.stage{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;--night:0;
  background:linear-gradient(180deg,#8fd3ff 0%,#c4ebff 55%,#eef9ff 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#141246,#302f7a 60%,#5d4f9c);opacity:calc(var(--night) * .88);pointer-events:none}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:calc(.85 - var(--night) * .65);animation:drift linear infinite;filter:blur(.5px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-70%}
.cloud::after{width:40%;height:120%;left:48%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#cv{position:absolute;inset:0;touch-action:none;z-index:1;display:block}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;z-index:6;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:50%;border:2.5px solid #6b4128;background:linear-gradient(#fff,#f3ead9);font-size:20px;line-height:1;
  box-shadow:0 3px 0 #6b4128,inset 0 2px 0 #fff;padding:0;display:grid;place-items:center}
.zoom button.fit{font-size:12px}
.th{width:100%;height:100%;object-fit:contain;display:block}
.qs{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;gap:10px;background:linear-gradient(#fff,#fff8ec);border:2.5px solid var(--ink);border-radius:16px;padding:6px 10px}
.qi{width:46px;height:46px;flex:none}.qi svg,.qi img{width:100%;height:100%;overflow:visible}
.qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.qt b{font-weight:400;font-size:15px}
.qbar{height:9px;background:#f1e4d6;border-radius:99px;overflow:hidden;border:2px solid var(--ink)}.qbar i{display:block;height:100%;background:var(--mint)}

/* 떠오르는 숫자 */
.pop{position:absolute;font-size:17px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  white-space:nowrap;transform:translate(-50%,0);animation:up 1.1s ease-out forwards}
.pop.gd{color:var(--gold)} .pop.mj{color:#c7b6ff} .pop.xp{color:#9df0c0}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}
 100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}

/* 목표 카드 */
.goal{position:absolute;left:10px;top:10px;z-index:6;display:flex;align-items:center;gap:8px;max-width:min(300px,60%);
  background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:5px 10px 5px 5px;text-align:left}
.goal .gi{width:34px;height:34px;flex:none;background:#fff1c9;border-radius:10px;border:2px solid var(--ink)}
.goal .gi svg{width:100%;height:100%}
.goal b{font-weight:400;font-size:14px;display:block}
.goal small{font-size:12px;color:var(--ink-soft)}
.hand{position:fixed;z-index:8;width:40px;height:40px;pointer-events:none;animation:poke .8s ease-in-out infinite;transition:left .25s,top .25s}
.hand svg{width:100%;height:100%}
@keyframes poke{50%{transform:translateY(-10px)}}

.hint{display:none;margin:0;text-align:center;font-size:13px;color:var(--ink-soft)}
@media (orientation:portrait) and (max-width:700px){.hint{display:block}}

/* 시트 */
.sheet-bg{position:fixed;inset:0;background:#3a24184d;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:min(780px,100%);max-height:80%;overflow:auto;box-sizing:border-box;
  border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:slide .22s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sheet h2{margin:0;font-size:20px;font-weight:400;flex:1;text-wrap:balance}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:2.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:4px 12px;font-size:15px}
.tab.on{background:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.card{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);
  padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.card:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card:disabled{opacity:.55;cursor:default}
.card .pic{width:54px;height:54px}
.card .pic svg{width:100%;height:100%;overflow:visible}
.card b{font-weight:400;font-size:15px}
.card small{font-size:12px;color:var(--ink-soft)}
.card .earn{font-size:12px;color:#d9822b}
.card .lockb{position:absolute;top:6px;right:6px;background:var(--ink);color:#fff;font-size:11px;border-radius:8px;padding:1px 5px}
.info{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.info .pic{width:84px;height:84px;flex:none;background:var(--grass);border-radius:22px;border:2.5px solid var(--ink)}
.info .pic svg{width:100%;height:100%;overflow:visible}
.info .txt{flex:1;min-width:170px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.info .big{font-size:22px}
.info .sub{font-size:13px;color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.list{margin:0;padding-left:18px;font-size:14px;line-height:1.7}
.sec{font-size:14px;color:var(--ink-soft);margin:14px 0 6px}

/* 대신 대화창 */
.talk{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:flex-end;gap:10px;justify-content:center;pointer-events:none}
.talk .who{width:92px;height:92px;flex:none;animation:bob 1.6s ease-in-out infinite}
.talk .who svg{width:100%;height:100%}
.talk .box{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);
  padding:10px 14px;max-width:560px;flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;animation:slide .2s ease-out}
.talk .box b{font-weight:400;color:var(--pink);font-size:14px}
.talk .box p{margin:0;font-size:17px;line-height:1.45}
.talk .box .row{justify-content:flex-end;margin:0}
.reward{display:flex;gap:8px;flex-wrap:wrap}
.reward span{background:#fff4d0;border:2px solid var(--ink);border-radius:10px;padding:1px 8px;font-size:14px}

/* 오프닝 */
.intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:radial-gradient(circle at 50% 120%,#a3e17f 0 30%,transparent 31%),linear-gradient(#ffe0ee,#cfeeff);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
.intro h1{margin:0;font-weight:400;font-size:clamp(40px,9vw,72px);color:var(--pink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--ink);letter-spacing:.02em}
.intro .art{width:min(200px,36vh);height:min(200px,36vh)}
.intro .art svg{width:100%;height:100%;overflow:visible}
.intro p{margin:0;font-size:17px}
.rulers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ruler{width:96px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:6px;display:flex;flex-direction:column;align-items:center;font-size:15px}
.ruler svg{width:70px;height:70px}
.ruler.on{background:#fff1c9;transform:translateY(-4px)}
.namein{font-family:var(--font);font-size:22px;color:var(--ink);text-align:center;border:3px solid var(--ink);border-radius:16px;padding:6px 12px;width:min(280px,80vw);
  user-select:text;-webkit-user-select:text;background:var(--paper)}

/* 레벨업 */
.lvup{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:#3a24185c;padding:16px;box-sizing:border-box}
.lvcard{background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:18px 22px;max-width:440px;width:100%;
  text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:popin .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.5);opacity:0}}
.lvcard h3{margin:0;font-weight:400;font-size:30px;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.unl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.unl div{width:74px;font-size:12px;display:flex;flex-direction:column;align-items:center}
.unl svg{width:46px;height:46px;overflow:visible}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:26;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;
  background:var(--ink);color:#fff;border-radius:16px;padding:8px 16px;font-size:15px;max-width:86vw;text-align:center;animation:slide .2s ease-out}
.placebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;
  background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);
  padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;font-size:15px;white-space:nowrap;max-width:94vw}
.placebar span{overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 광택 UI */
.chip{background:linear-gradient(#fff,#fff3e2);border-color:#6b4128;box-shadow:0 3px 0 #6b4128,inset 0 -3px 0 #f3dcc0}
.btn{background:linear-gradient(#ffa3c4,#ff5f93);border-color:#6b4128;box-shadow:0 4px 0 #6b4128,inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12);text-shadow:0 1px 0 rgba(120,20,60,.35)}
.btn:active{box-shadow:0 1px 0 #6b4128,inset 0 2px 0 rgba(255,255,255,.55)}
.btn.y{background:linear-gradient(#ffe68a,#ffbb2a);text-shadow:none}
.btn.w{background:linear-gradient(#fff,#f1e6d2);text-shadow:none}
.btn.m{background:linear-gradient(#b9a6ff,#7457ee)}
.btn.g{background:linear-gradient(#97f2d0,#3cc298);text-shadow:none}
.sheet{background:linear-gradient(#fffaf0,#fff0d6);border-color:#6b4128}
.sheet header{border-bottom:2px dashed #e8d2b0;padding-bottom:8px}
.card{background:linear-gradient(#fff,#fff6e6);border-color:#6b4128;box-shadow:0 4px 0 #6b4128,inset 0 -3px 0 #f3e2c8}
.card .pic{width:70px;height:70px}
.info .pic{background:radial-gradient(circle at 50% 62%,#c6ecaa,#8fd16a);border-color:#6b4128}
.goal{background:linear-gradient(#fff,#fff3e2);border-color:#6b4128;box-shadow:0 3px 0 #6b4128}
.goal .gi img{width:100%;height:100%}
.talk .box{background:linear-gradient(#fff,#fff7ea);border-color:#6b4128;box-shadow:0 5px 0 #6b4128}
.lvcard{background:linear-gradient(#fffaf0,#ffefd2)}
.unl img{width:52px;height:52px}
.intro .art img{width:100%;height:100%}
</style>

<div id="app">
  <header class="hud">
    <button class="chip me" id="meBtn"><span class="face" id="meFace"></span><span class="nm"><span id="kName">말랑 왕국</span><small id="kSub">레벨 1</small></span></button>
    <div class="chip"><span class="lvnum" id="lvNum">1</span><div class="xp"><i id="xpFill"></i></div></div>
    <div class="chip"><span id="icGold"></span><b id="gold">0</b></div>
    <div class="chip"><span id="icMojo"></span><b id="mojo">0</b></div>
    <div class="chip clock"><span id="clock"></span><em id="spd"></em></div>
    <span class="spacer"></span>
    <button class="btn y" id="allBtn" hidden>모두 거두기</button>
    <button class="btn" id="shopBtn">상점</button>
    <button class="btn w" id="devBtn">테스트</button>
  </header>
  <main class="stage" id="stage">
    <div class="cloud" style="width:120px;height:34px;top:12%;animation-duration:70s;animation-delay:-20s"></div>
    <div class="cloud" style="width:90px;height:26px;top:70%;animation-duration:90s;animation-delay:-60s"></div>
    <div class="cloud" style="width:150px;height:40px;top:40%;animation-duration:110s;animation-delay:-5s;opacity:.6"></div>
    <canvas id="cv" aria-label="왕국 지도"></canvas>
    <div class="zoom"><button id="zIn" aria-label="확대">+</button><button id="zOut" aria-label="축소">−</button><button id="zFit" class="fit" aria-label="전체 보기">전체</button></div>
    <button class="goal" id="goal" hidden><span class="gi" id="goalIc"></span><span><b id="goalT"></b><small id="goalP"></small></span></button>
    <div class="fx" id="fx"></div>
  </main>
  <p class="hint">폰을 가로로 돌리면 왕국이 더 크게 보여요</p>
</div>
<div class="hand" id="hand" hidden></div>
<div class="sheet-bg" id="sheetBg" hidden><section class="sheet" id="sheet">
  <header><h2 id="shTitle"></h2><button class="btn w" id="shClose">닫기</button></header>
  <div id="shBody"></div>
</section></div>
<div class="talk" id="talk" hidden><div class="who" id="talkWho"></div><div class="box"><b id="talkName">몽실 대신</b><p id="talkTxt"></p><div id="talkExtra"></div><div class="row"><button class="btn" id="talkBtn">다음</button></div></div></div>
<div class="placebar" id="placeBar" hidden><span id="placeTxt"></span><button class="btn w" id="placeCancel">그만</button></div>
<div class="lvup" id="lvup" hidden><div class="lvcard"><h3 id="lvT"></h3><div id="lvB"></div><button class="btn y big" id="lvOk">좋아요!</button></div></div>
<div class="intro" id="intro" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 시간 설정 =====
   개발 중: DEV=true, 기본 20배속 (게임 1시간 = 실제 3분)
   최종 빌드: DEV=false 로 바꾸면 리얼타임(×1) + 테스트 버튼 숨김 */
const DEV = true;
const DEV_SPEED = 20;
const VERSION = 'v0.5';

const COLS=41, ROWS=41, M=60, H=3600, DAY=86400;

/* ===== 원작 위룰 기준 데이터 =====
   작물: 원작 표 그대로(해금 레벨·씨앗값·시간·골드·경험치)
   레벨: 원작 누적 경험치 표, 레벨업 모조 보상 */
const CROPS={
  corn:{n:'옥수수',lv:1,cost:0,t:45,g:5,x:1},
  wheat:{n:'밀',lv:1,cost:5,t:5*M,g:25,x:8},
  onion:{n:'양파',lv:3,cost:25,t:1*H,g:125,x:40},
  berry:{n:'딸기',lv:4,cost:30,t:1.5*H,g:150,x:50},
  beans:{n:'콩',lv:4,cost:85,t:DAY,g:425,x:140},
  squash:{n:'애호박',lv:5,cost:45,t:5*H,g:225,x:75},
  carrot:{n:'당근',lv:6,cost:65,t:12*H,g:325,x:105},
  pumpkin:{n:'호박',lv:9,cost:40,t:3*H,g:200,x:65},
  potato:{n:'감자',lv:10,cost:50,t:6*H,g:250,x:80},
  asparagus:{n:'마법 아스파라거스',lv:11,cost:400,t:12*H,g:1200,x:250},
  peas:{n:'완두콩',lv:12,cost:20,t:30*M,g:100,x:33},
  melon:{n:'수박',lv:13,cost:75,t:16*H,g:375,x:125},
  artichoke:{n:'아티초크',lv:14,cost:80,t:18*H,g:425,x:155},
  rice:{n:'벼',lv:15,cost:10,t:15*M,g:65,x:22},
  peppers:{n:'고추',lv:16,cost:60,t:10*H,g:315,x:105},
  cauliflower:{n:'마법 콜리플라워',lv:17,cost:700,t:12*H,g:2000,x:350},
  broccoli:{n:'브로콜리',lv:18,cost:45,t:2*H,g:175,x:58},
  lettuce:{n:'상추',lv:19,cost:55,t:4*H,g:215,x:70},

const KEY='malang-kingdom-v2';
function fresh(){
  const tiles=Array.from({length:COLS*ROWS},()=>({t:'grass'}));
  const at=(c,r)=>r*COLS+c;
  for(const i of[at(CX,CY),at(CX+1,CY),at(CX,CY+1),at(CX+1,CY+1)])tiles[i]={t:'castle'};
  for(const c of[CX-1,CX,CX+1])tiles[at(c,CY+2)]={t:'plot'};
  return {v:5,gt:8*H,real:Date.now(),gold:250,xp:0,level:1,mojo:10,land:0,speed:DEV?DEV_SPEED:1,
    tiles,star:null,nextStar:8*H+40*M,daily:'',name:'말랑 왕국',ruler:'king',started:false,
    goal:0,gbase:0,quests:null,st:{corn:0,plots:0,mojo:0,pine:0,cottage:0,tax:0,expand:0,road:0}};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===5)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
if(!DEV)S.speed=1;
S.gt+=Math.max(0,(Date.now()-S.real)/1000)*S.speed;   // 앱을 꺼둔 동안에도 시간이 흘러요
S.real=Date.now();

let sel=-1, placing=null, liveFn=null, resetArm=false, shopTab='house', talking=false;
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(1,v));
const prog=(a,b)=>b<=a?1:clamp((S.gt-a)/(b-a));
const rnd=(a,b)=>a+Math.random()*(b-a);
const inR=(R,c,r)=>c>=R.x0&&c<R.x1&&r>=R.y0&&r<R.y1;
const unlocked=(c,r)=>inR(RECTS[S.land],c,r);
const viewR=()=>RECTS[S.land+1]||RECTS[S.land];
const isNight=()=>{const h=Math.floor(S.gt%DAY/H);return h<5||h>=20};
const isNext=(c,r)=>{const n=RECTS[S.land+1];return !!n&&inR(n,c,r)};
const lvXp=l=>LV_XP[l]??(LV_XP[LV_XP.length-1]+(l-LV_XP.length+1)*120000);
const cnt=fn=>S.tiles.filter((T,i)=>unlocked(i%COLS,(i/COLS)|0)&&fn(T)).length;

function fmt(s){s=Math.max(0,Math.ceil(s));
  if(s>=DAY){const d=Math.floor(s/DAY),h=Math.floor(s%DAY/H);return h?`${d}일 ${h}시간`:`${d}일`}
  if(s>=H){const h=Math.floor(s/H),m=Math.floor(s%H/M);return m?`${h}시간 ${m}분`:`${h}시간`}
  if(s>=M){const m=Math.floor(s/M),x=s%M;return x&&m<10?`${m}분 ${x}초`:`${m}분`}
  return `${s}초`}
const remain=s=>fmt(s)+(S.speed!==1?` · 실제 ${fmt(s/S.speed)}`:'');
/* 원작: 12시간 이상 남으면 모조 8개, 남은 시간이 줄수록 싸짐 */
const mojoCost=rem=>Math.max(1,Math.min(8,Math.ceil(rem/(1.5*H))));

function cropState(T){
  if(!T.crop)return'empty';
  if(S.gt<T.readyAt)return'grow';
  const C=CROPS[T.crop],spoil=Math.max(C.t*1.5,20*M);
  return S.gt<T.readyAt+spoil?'ready':'dead';
}
function bldState(T){
  const B=BUILDS[T.b];
  if(S.gt<T.doneAt)return'build';
  if(B.cat==='house')return S.gt>=T.taxAt?'tax':'idle';
  if(B.cat==='shop'){if(!T.job)return'open';return S.gt>=T.job.doneAt?'done':'work'}
  return'deco';
}
function remainOf(T){
  if(T.t==='plot')return T.readyAt-S.gt;
  const s=bldState(T);
  if(s==='build')return T.doneAt-S.gt;
  if(s==='work')return T.job.doneAt-S.gt;
  if(s==='idle')return T.taxAt-S.gt;
  return 0;
}

/* ===== 아이소메트릭 렌더러 =====
   타일 좌표(u,v)와 높이 z를 화면으로 투영. 바닥(풀·밭·길·절벽)은 캐시, 물체는 매 프레임 깊이순으로 그림 */
const stage=$('stage'), fx=$('fx'), cv=$('cv'), ctx=cv.getContext('2d');
const W2=48, H2=24;
const P=(u,v,z=0)=>[(u-v)*W2,(u+v)*H2-z];
const cam={x:0,y:0,z:1};
let DPR=1, CW=0, CH=0, g=ctx, pinching=false;
const LINE='rgba(74,42,26,.42)';
function rng(seed){let s=(seed*9301+49297)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return(s%10000)/10000}}
const hash=i=>((i*2654435761)>>>0)%1000/1000;
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function shade(h,a){if(!h.startsWith('#'))return h;const[r,gg,b]=hex2rgb(h),f=a<0?0:255,t=Math.abs(a);
  return`rgb(${Math.round(r+(f-r)*t)},${Math.round(gg+(f-gg)*t)},${Math.round(b+(f-b)*t)})`}

function mask(i,cat){const c=i%COLS,r=(i/COLS)|0;let m=0;
  const same=(cc,rr)=>{if(cc<0||rr<0||cc>=COLS||rr>=ROWS)return false;const T=S.tiles[rr*COLS+cc];
    return (T.t==='bld'&&BUILDS[T.b]?.cat===cat)||(cat==='road'&&T.t==='castle')};
  if(same(c,r-1))m|=1;if(same(c+1,r))m|=2;if(same(c,r+1))m|=4;if(same(c-1,r))m|=8;return m}
/* --- 기본 도형 --- */
function path(pts){g.beginPath();pts.forEach((p,k)=>{const[x,y]=P(p[0],p[1],p[2]||0);k?g.lineTo(x,y):g.moveTo(x,y)});g.closePath()}
function fillP(pts,fill,line=LINE,lw=1.2){path(pts);g.fillStyle=fill;g.fill();if(line){g.strokeStyle=line;g.lineWidth=lw;g.lineJoin='round';g.stroke()}}
function line3(a,b,col,w){const[x1,y1]=P(...a),[x2,y2]=P(...b);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.stroke()}
function box(u0,v0,u1,v1,z0,z1,col,o={}){
  fillP([[u0,v1,z0],[u1,v1,z0],[u1,v1,z1],[u0,v1,z1]],o.left||col);
  fillP([[u1,v0,z0],[u1,v1,z0],[u1,v1,z1],[u1,v0,z1]],o.right||shade(col,-.17));
  fillP([[u0,v0,z1],[u1,v0,z1],[u1,v1,z1],[u0,v1,z1]],o.top||shade(col,.16));
}
function faceL(v,ua,ub,za,zb,col,line=LINE){fillP([[ua,v,za],[ub,v,za],[ub,v,zb],[ua,v,zb]],col,line)}
function faceR(u,va,vb,za,zb,col,line=LINE){fillP([[u,va,za],[u,vb,za],[u,vb,zb],[u,va,zb]],col,line)}
function roofGable(u0,v0,u1,v1,zt,zr,col,wall){const o=.07,vm=(v0+v1)/2;
  fillP([[u0-o,v0-o,zt-2],[u1+o,v0-o,zt-2],[u1+o,vm,zr],[u0-o,vm,zr]],shade(col,.2));
  fillP([[u1,v0,zt],[u1,vm,zr-3],[u1,v1,zt]],shade(wall,-.17));
  fillP([[u0-o,vm,zr],[u1+o,vm,zr],[u1+o,v1+o,zt-2],[u0-o,v1+o,zt-2]],col);
  line3([u0-o,vm,zr],[u1+o,vm,zr],shade(col,.35),2);
}
function roofPyr(u0,v0,u1,v1,zt,zr,col){const o=.07;u0-=o;v0-=o;u1+=o;v1+=o;const uc=(u0+u1)/2,vc=(v0+v1)/2;
  fillP([[u0,v0,zt],[u1,v0,zt],[uc,vc,zr]],shade(col,.22));
  fillP([[u0,v0,zt],[u0,v1,zt],[uc,vc,zr]],shade(col,.12));
  fillP([[u0,v1,zt],[u1,v1,zt],[uc,vc,zr]],col);
  fillP([[u1,v0,zt],[u1,v1,zt],[uc,vc,zr]],shade(col,-.15));

const RX=r=>r*W2*1.414;

const walkers=[];
function syncWalkers(){
  const want=Math.min(10+S.land*2,cnt(T=>T.t==='bld'&&BUILDS[T.b].cat==='house'&&bldState(T)!=='build')*2+cnt(T=>T.t==='bld'&&BUILDS[T.b].cat==='shop'&&bldState(T)!=='build'));
  while(walkers.length<want){const n=walkers.length,L=RECTS[S.land];
    let u,v;do{u=rnd(L.x0+.2,L.x1-.2);v=rnd(L.y0+.2,L.y1-.2)}while(S.tiles[Math.floor(v)*COLS+Math.floor(u)].t==='castle');walkers.push({u,v,tu:u,tv:v,wait:rnd(0,2),col:VCOL[n%VCOL.length],hat:n%3===0?VCOL[(n+3)%VCOL.length]:null,hair:['#7a4a2a','#3a2418','#c98a4b','#5a3a28'][n%4],dir:1,talk:0,say:'',bow:0})}
  walkers.length=Math.min(walkers.length,want);
}
function stepWalkers(dt){
  const L=RECTS[S.land],roads=[];S.tiles.forEach((T,i)=>{if(T.t==='bld'&&BUILDS[T.b]?.cat==='road'&&unlocked(i%COLS,(i/COLS)|0))roads.push(i)});
  for(const w of walkers){
    if(w.talk>0)w.talk-=dt;if(w.bow>0)w.bow-=dt;
    const du=w.tu-w.u,dv=w.tv-w.v,d=Math.hypot(du,dv);
    if(d>.02){const sp=.55*dt;w.u+=du/d*Math.min(sp,d);w.v+=dv/d*Math.min(sp,d);w.dir=(du-dv)<0?-1:1;w.moving=true}
    else{w.moving=false;w.wait-=dt;if(w.wait<=0){
      let c,r;if(roads.length&&Math.random()<.55){const i=roads[Math.floor(Math.random()*roads.length)];c=i%COLS;r=(i/COLS)|0}
      else{c=Math.max(L.x0,Math.min(L.x1-1,Math.floor(w.u)+Math.round(rnd(-2,2))));r=Math.max(L.y0,Math.min(L.y1-1,Math.floor(w.v)+Math.round(rnd(-2,2))))}

}

/* --- 바닥: 8×8칸 구역별 캐시(화면에 보이는 구역만 그림) --- */
const CHK=8,chunks={};
function chunkBox(cx,cy){const u0=cx*CHK,v0=cy*CHK,u1=Math.min(COLS,u0+CHK),v1=Math.min(ROWS,v0+CHK),edge=v1===ROWS||u1===COLS;
  return{u0,v0,u1,v1,x0:P(u0,v1)[0]-8,x1:P(u1,v0)[0]+8,y0:P(u0,v0)[1]-8,y1:P(u1,v1)[1]+(edge?150:10)}}
function chunkSig(b){let s=S.land+'|';for(let v=b.v0;v<b.v1;v++)for(let u=b.u0;u<b.u1;u++){const i=v*COLS+u,T=S.tiles[i];
  s+=T.t==='plot'?'p':T.t==='castle'?'c':(T.t==='bld'&&BUILDS[T.b]?.cat==='road')?T.b[5]+mask(i,'road'):'.'}return s}
const cliffDepth=(k,side)=>78+Math.sin(k*.85+side)*14+hash(k*7+side*1000)*22;
function cliffSeg(a,b,side){ // side 0: 왼쪽 아래 가장자리(v=ROWS), 1: 오른쪽 아래(u=COLS)
  const pt=s=>side?[COLS,s]:[s,ROWS],ks=[];for(let k=a*2;k<=b*2;k++)ks.push(k);
  const dk=k=>cliffDepth(k,side);
  g.beginPath();ks.forEach((k,n)=>{const[x,y]=P(...pt(k/2));n?g.lineTo(x,y):g.moveTo(x,y)});
  for(let n=ks.length-1;n>=0;n--){const[x,y]=P(...pt(ks[n]/2));g.lineTo(x,y+dk(ks[n]))}g.closePath();
  const gr=g.createLinearGradient(0,(COLS+ROWS)*H2*.5,0,(COLS+ROWS)*H2+100);gr.addColorStop(0,side?'#a8703f':'#c48a55');gr.addColorStop(1,side?'#6e4426':'#8a5a33');
  g.fillStyle=gr;g.fill();g.strokeStyle='rgba(74,42,26,.35)';g.lineWidth=1.5;g.stroke();
  g.save();g.clip();ks.forEach(k=>{const[x,y]=P(...pt(k/2)),h=hash(k*13+side*77);g.fillStyle='rgba(255,230,190,.12)';g.fillRect(x-14,y+22+h*20,26,3);
    if(h<.5){g.beginPath();g.ellipse(x+h*20-5,y+40+h*18,5+h*5,3+h*2,0,0,7);g.fillStyle=side?'#8a6a55':'#a8876a';g.fill()}});g.restore();
  g.beginPath();ks.forEach((k,n)=>{const[x,y]=P(...pt(k/2));n?g.lineTo(x,y):g.moveTo(x,y)});
  for(let n=ks.length-1;n>=0;n--){const k=ks[n],[x,y]=P(...pt(k/2));g.lineTo(x,y+7+Math.sin(k*2.3)*2.5)}g.closePath();g.fillStyle=side?'#4f9a37':'#5fae45';g.fill();
  g.strokeStyle='rgba(110,70,40,.55)';g.lineWidth=1.4;ks.forEach(k=>{if(k%3)return;const[x,y]=P(...pt(k/2)),d=dk(k);g.beginPath();g.moveTo(x,y+d-2);g.quadraticCurveTo(x+4,y+d+8,x-2,y+d+16);g.stroke()});
}
function buildChunk(ch,sc){
  const b=ch.b;ch.sc=sc;const cvs=ch.cv;cvs.width=Math.max(1,Math.ceil((b.x1-b.x0)*sc));cvs.height=Math.max(1,Math.ceil((b.y1-b.y0)*sc));
  const prev=g;g=cvs.getContext('2d');g.setTransform(sc,0,0,sc,-b.x0*sc,-b.y0*sc);
  if(b.v1===ROWS)cliffSeg(b.u0,b.u1,0);if(b.u1===COLS)cliffSeg(b.v0,b.v1,1);
  g.save();path([[b.u0,b.v0],[b.u1,b.v0],[b.u1,b.v1],[b.u0,b.v1]]);g.clip();
  const gr=g.createLinearGradient(0,0,0,(COLS+ROWS)*H2);gr.addColorStop(0,'#a6df7a');gr.addColorStop(.5,'#96d56a');gr.addColorStop(1,'#84c75a');g.fillStyle=gr;g.fill();
  const R=rng(b.u0*31+b.v0*17+5);
  for(let n=0;n<10;n++){const[x,y]=P(b.u0+R()*(b.u1-b.u0),b.v0+R()*(b.v1-b.v0));g.beginPath();g.ellipse(x,y,40+R()*60,18+R()*26,0,0,7);g.fillStyle=R()<.5?'rgba(60,130,40,.08)':'rgba(255,255,200,.09)';g.fill()}
  const fine=sc>=.55;
  for(let r=b.v0;r<b.v1;r++)for(let c=b.u0;c<b.u1;c++){const i=r*COLS+c,Rr=rng(i*7+3);
    if(fine)for(let n=0;n<20;n++){const[x,y]=P(c+Rr(),r+Rr());g.strokeStyle=Rr()<.6?'rgba(70,140,50,.5)':'rgba(205,242,165,.8)';g.lineWidth=1.1;
      g.beginPath();g.moveTo(x-2,y-4);g.lineTo(x,y);g.lineTo(x+2,y-4.5);g.stroke()}
    if(Rr()<.3){const[x,y]=P(c+.15+Rr()*.7,r+.15+Rr()*.7);const fc=['#fff','#ffe066','#ff9cc0','#c9b6ff'][Math.floor(Rr()*4)];
      for(let n=0;n<3;n++){const ox=Rr()*14-7,oy=Rr()*7-3.5;for(let a=0;a<4;a++){g.beginPath();g.arc(x+ox+Math.cos(a*1.57)*1.8,y+oy+Math.sin(a*1.57)*1.8,1.6,0,7);g.fillStyle=fc;g.fill()}g.beginPath();g.arc(x+ox,y+oy,1.1,0,7);g.fillStyle='#ffb02e';g.fill()}}
    if(Rr()<.12){const[x,y]=P(c+Rr(),r+Rr());g.beginPath();g.ellipse(x,y,3,2,0,0,7);g.fillStyle='#c9c3b4';g.fill()}
    const T=S.tiles[i];
    if(!unlocked(c,r)){path([[c,r],[c+1,r],[c+1,r+1],[c,r+1]]);g.fillStyle=isNext(c,r)?'rgba(240,250,255,.34)':'rgba(214,236,206,.5)';g.fill();continue}
    if(T.t==='castle'){fillP([[c,r],[c+1,r],[c+1,r+1],[c,r+1]],'#efe2c9',null);
      for(let n=1;n<4;n++){line3([c+n*.25,r,0],[c+n*.25,r+1,0],'rgba(180,150,110,.35)',1);line3([c,r+n*.25,0],[c+1,r+n*.25,0],'rgba(180,150,110,.35)',1)}}
    if(T.t==='bld'&&BUILDS[T.b]?.cat==='road'){const B=BUILDS[T.b],m=mask(i,'road');
      const sq=(a,bb,col)=>{const S2=(u0,v0,u1,v1)=>fillP([[u0,v0],[u1,v0],[u1,v1],[u0,v1]],col,null);S2(c+a,r+a,c+bb,r+bb);
        if(m&1)S2(c+a,r,c+bb,r+.5);if(m&2)S2(c+.5,r+a,c+1,r+bb);if(m&4)S2(c+a,r+.5,c+bb,r+1);if(m&8)S2(c,r+a,c+.5,r+bb)};
      sq(.15,.85,shade(B.col[1],-.15));sq(.2,.8,B.col[0]);
      const Rq=rng(i+99);for(let n=0;n<9;n++){const[x,y]=P(c+.25+Rq()*.5,r+.25+Rq()*.5);g.beginPath();g.ellipse(x,y,T.b==='road_stone'?5:2,T.b==='road_stone'?2.6:1.2,0,0,7);
        g.fillStyle=T.b==='road_stone'?'rgba(255,255,255,.35)':B.col[1];g.fill();if(T.b==='road_stone'){g.strokeStyle='rgba(120,110,95,.4)';g.lineWidth=.8;g.stroke()}}
      if(T.b==='road_gold'){for(let n=0;n<3;n++){const[x,y]=P(c+.3+Rq()*.4,r+.3+Rq()*.4);starShape(x,y,2.4,'#fff')}}}
    if(T.t==='plot'){box(c+.07,r+.07,c+.93,r+.93,0,4,'#b9784a',{top:'#a5643a',left:'#c58552',right:'#9c5c35'});
      for(let n=1;n<=4;n++){const v=r+.07+n*.172;line3([c+.12,v,4],[c+.88,v,4],'#8a4f2c',2.2);line3([c+.12,v-.04,4],[c+.88,v-.04,4],'rgba(220,160,110,.55)',1)}}
  }
  g.restore();g=prev;
}
function drawGroundChunks(view){
  const sc=Math.min(2.5,cam.z*DPR),now=performance.now();
  for(let cy=0;cy*CHK<ROWS;cy++)for(let cx=0;cx*CHK<COLS;cx++){
    const key=cx+','+cy;let ch=chunks[key];if(!ch){ch=chunks[key]={b:chunkBox(cx,cy),cv:document.createElement('canvas'),sig:'',sc:0,used:0}}
    const b=ch.b;if(b.x1<view.x0||b.x0>view.x1||b.y1<view.y0||b.y0>view.y1)continue;
    const sig=chunkSig(b);if(sig!==ch.sig||(!pinching&&Math.abs(sc/ch.sc-1)>.3)){ch.sig=sig;buildChunk(ch,sc)}
    ch.used=now;g.drawImage(ch.cv,b.x0,b.y0,ch.cv.width/ch.sc,ch.cv.height/ch.sc);
  }
}
setInterval(()=>{const now=performance.now();for(const k in chunks){if(now-chunks[k].used>8000){chunks[k].cv.width=chunks[k].cv.height=1;chunks[k].sig='';chunks[k].sc=0}}},4000);

/* --- 야생(아직 안 연 땅의 숲·바위) --- */
function wildAt(i){const h=hash(i*13+7);if(h<.11)return'wpine';if(h<.17)return'woak';if(h<.205)return'wrock';if(h<.25)return'wbush';return null}
const wildSpr={};
function wildSprite(k,sc){const key=k+'|'+Math.round(sc*4);if(wildSpr[key])return wildSpr[key];
  const c=document.createElement('canvas'),s=Math.min(2.5,Math.max(.2,Math.round(sc*4)/4));c.width=Math.ceil(120*s);c.height=Math.ceil(130*s);const prev=g;g=c.getContext('2d');
  g.setTransform(s,0,0,s,60*s,(110-24)*s);
  if(k==='wpine')drawTree(0,0,'pine',0);else if(k==='woak')drawTree(0,0,'oak',0);
  else if(k==='wrock'){shadow(.5,.5,.25);const[x,y]=P(.5,.5);ball(x-6,y-6,10,'#b8b2c8');ball(x+8,y-4,7,'#a9a3b8');ball(x+1,y-12,6,'#c9c3d6')}
  else{const[x,y]=P(.5,.5);shadow(.5,.5,.22);ball(x-7,y-7,8,'#4fae4a');ball(x+7,y-6,7,'#5cbf55');ball(x,y-12,8,'#62c45a');ball(x+3,y-9,1.8,'#ff8fb0',false)}
  g=prev;wildSpr[key]={c,s};return wildSpr[key]}

/* --- 그리기 --- */
let DRAWN=[];
function nightAmt(){const hf=(S.gt%DAY)/H;if(hf>=20||hf<5)return 1;if(hf>=18)return(hf-18)/2;if(hf<7)return(7-hf)/2;return 0}
function screenView(){const x0=-cam.x/cam.z,y0=-cam.y/cam.z,x1=(CW-cam.x)/cam.z,y1=(CH-cam.y)/cam.z;return{x0,y0,x1,y1}}
function tileRange(v){const cs=[[v.x0,v.y0],[v.x1,v.y0],[v.x0,v.y1],[v.x1,v.y1]].map(([x,y])=>[(x/W2+y/H2)/2,(y/H2-x/W2)/2]);
  const us=cs.map(p=>p[0]),vs=cs.map(p=>p[1]);
  return{c0:Math.max(0,Math.floor(Math.min(...us))-1),c1:Math.min(COLS-1,Math.ceil(Math.max(...us))+4),r0:Math.max(0,Math.floor(Math.min(...vs))-1),r1:Math.min(ROWS-1,Math.ceil(Math.max(...vs))+4)}}
function draw(t){
  g=ctx;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
  const sc=cam.z*DPR;g.setTransform(sc,0,0,sc,cam.x*DPR,cam.y*DPR);
  const view=screenView();drawGroundChunks(view);
  const TR=tileRange(view),list=[];
  for(let r=TR.r0;r<=TR.r1;r++)for(let c=TR.c0;c<=TR.c1;c++){const i=r*COLS+c,T=S.tiles[i];
    if(T.t==='castle'){if(i===CI)list.push({k:CX+CY+2,i,f:()=>{g.save();g.translate(...P(CX,CY));drawCastle(castleTier(),t);g.restore()},h:150,big:1});continue}
    if(!unlocked(c,r)){const w=wildAt(i);if(w){list.push({k:c+r+1,f:()=>{const sp=wildSprite(w,sc),[x,y]=P(c+.5,r+.5);g.globalAlpha=isNext(c,r)?.9:.8;g.drawImage(sp.c,x-60,y-110,sp.c.width/sp.s,sp.c.height/sp.s);g.globalAlpha=1}})}continue}
    if(T.t==='plot'){if(T.crop)list.push({k:c+r+1,i,f:()=>drawCrops(c,r,T,t),h:30});continue}
    if(T.t!=='bld')continue;const B=BUILDS[T.b];if(!B||B.cat==='road')continue;
    const s=bldState(T);
    if(s==='build')list.push({k:c+r+1,i,f:()=>drawScaffold(c,r,prog(T.startAt,T.doneAt),t),h:50});
    else if(B.cat==='fence')list.push({k:c+r+1,i,f:()=>drawFence(c,r,T.b,i,t),h:24});
    else if(HOUSES[T.b])list.push({k:c+r+1,i,f:()=>drawHouse(c,r,T.b,t),h:bh(T.b)});
    else if(SPECIAL.includes(T.b))list.push({k:c+r+1,i,f:()=>drawSpecial(c,r,T.b,t),h:bh(T.b)});
    else list.push({k:c+r+1,i,f:()=>drawDeco(c,r,T.b,i,t),h:bh(T.b)});
  }
  walkers.forEach(w=>list.push({k:w.u+w.v,w,f:()=>drawWalker(w,t)}));
  list.sort((a,b)=>a.k-b.k);list.forEach(d=>d.f());DRAWN=list;
  // 밤
  const na=nightAmt();
  if(na>0){g.save();g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='source-atop';g.fillStyle=`rgba(28,26,92,${na*.42})`;g.fillRect(0,0,cv.width,cv.height);g.restore();
    g.save();g.globalCompositeOperation='lighter';
    for(const d of list){if(d.i==null||d.big)continue;const T=S.tiles[d.i];if(T.t!=='bld')continue;const c=d.i%COLS,r=(d.i/COLS)|0,B=BUILDS[T.b];
      const glow=(z,rad,a)=>{const[x,y]=P(c+.5,r+.5,z);const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(255,220,120,${a*na})`);gr.addColorStop(1,'rgba(255,200,80,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,7);g.fill()};
      if(T.b==='lamp')glow(50,70,.55);else if(T.b==='firefly')glow(40,50,.4);else if(B.cat==='house'||B.cat==='shop')glow(14,34,.3)}
    {const[x,y]=P(CX+1,CY+1.62,30);const gr=g.createRadialGradient(x,y,0,x,y,60);gr.addColorStop(0,`rgba(255,220,140,${.35*na})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,60,0,7);g.fill()}
    g.restore()}
  // 배치 안내
  if(placing){for(let r=TR.r0;r<=TR.r1;r++)for(let c=TR.c0;c<=TR.c1;c++){if(!unlocked(c,r)||S.tiles[r*COLS+c].t!=='grass')continue;
    path([[c+.08,r+.08],[c+.92,r+.08],[c+.92,r+.92],[c+.08,r+.92]]);g.fillStyle=`rgba(255,255,255,${.22+.1*Math.sin(t*4)})`;g.fill();g.setLineDash([5,4]);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=1.6;g.stroke();g.setLineDash([])}}
  // 다음 땅 경계선
  const NR=RECTS[S.land+1];if(NR){const R0=RECTS[S.land];g.save();g.setLineDash([8,6]);
    path([[R0.x0,R0.y0],[R0.x1,R0.y0],[R0.x1,R0.y1],[R0.x0,R0.y1]]);g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2.4;g.stroke();g.restore()}
  // 뱃지·진행바
  for(const d of list){if(d.w||d.i==null||d.big)continue;const i=d.i,T=S.tiles[i],c=i%COLS,r=(i/COLS)|0;const[x,y]=P(c+.5,r+.5);
    if(T.t==='plot'){const s=cropState(T);if(s==='ready')badge(x,y-42,'coin',t+i);else if(s==='grow')bar(x,y+6,prog(T.plantedAt,T.readyAt));continue}
    if(T.t!=='bld')continue;const s=bldState(T),top=y-d.h-14;
    if(s==='build')bar(x,y+8,prog(T.startAt,T.doneAt));

function viewBox(){const V=viewR();return{x0:P(V.x0,V.y1)[0]-20,x1:P(V.x1,V.y0)[0]+20,y0:P(V.x0,V.y0)[1]-130,y1:P(V.x1,V.y1)[1]+40}}
function fitCam(){const b=viewBox();cam.z=Math.max(.3,Math.min(1.6,Math.min(CW/(b.x1-b.x0),CH/(b.y1-b.y0))));
  cam.x=CW/2-(b.x0+b.x1)/2*cam.z;cam.y=CH/2-(b.y0+b.y1)/2*cam.z+8}
function fitAll(){const x0=P(0,ROWS)[0],x1=P(COLS,0)[0],y0=-60,y1=(COLS+ROWS)*H2+110;cam.z=Math.max(ZMIN,Math.min(CW/(x1-x0),CH/(y1-y0)));cam.x=CW/2-(x0+x1)/2*cam.z;cam.y=CH/2-(y0+y1)/2*cam.z}
function clampCam(){const x0=P(0,ROWS)[0],x1=P(COLS,0)[0],y0=-150,y1=(COLS+ROWS)*H2+150,m=60;
  cam.x=Math.min(CW-m-x0*cam.z,Math.max(m-x1*cam.z,cam.x));cam.y=Math.min(CH-m-y0*cam.z,Math.max(m-y1*cam.z,cam.y))}
let ZMIN=.12;
function resize(){
  const r=stage.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);CW=r.width;CH=r.height;
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);cv.style.width=CW+'px';cv.style.height=CH+'px';{const x0=P(0,ROWS)[0],x1=P(COLS,0)[0];ZMIN=Math.min(.3,CW/(x1-x0)*.9)}fitCam();
}
addEventListener('resize',resize);
function zoomAt(f,sx,sy){const nz=Math.max(ZMIN,Math.min(2.6,cam.z*f));const wx=(sx-cam.x)/cam.z,wy=(sy-cam.y)/cam.z;cam.z=nz;cam.x=sx-wx*nz;cam.y=sy-wy*nz;clampCam()}
$('zIn').onclick=()=>zoomAt(1.25,CW/2,CH/2);$('zOut').onclick=()=>zoomAt(.8,CW/2,CH/2);let fitToggle=false;$('zFit').onclick=()=>{fitToggle=!fitToggle;if(fitToggle)fitAll();else fitCam();$('zFit').textContent=fitToggle?'왕국':'전체'};

/* --- 터치 --- */
const ptrs=new Map();let drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:cam.x,cy:cam.y};pinching=true;if(drag)drag.moved=true}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const rc=cv.getBoundingClientRect();
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const nz=Math.max(ZMIN,Math.min(2.6,pinch.z*d/pinch.d)),wx=(pinch.mx-rc.left-pinch.cx)/pinch.z,wy=(pinch.my-rc.top-pinch.cy)/pinch.z;
    cam.z=nz;cam.x=mx-rc.left-wx*nz;cam.y=my-rc.top-wy*nz;clampCam();return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>9)drag.moved=true;if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;clampCam()}}});
const endPtr=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size<2&&pinch){pinch=null;pinching=false;drag=null;return}
  if(drag&&!drag.moved&&e.type==='pointerup'){const rc=cv.getBoundingClientRect();pick(e.clientX-rc.left,e.clientY-rc.top)}
  if(!ptrs.size)drag=null};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();const rc=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:.89,e.clientX-rc.left,e.clientY-rc.top)},{passive:false});
function pick(sx,sy){
  const wx=(sx-cam.x)/cam.z,wy=(sy-cam.y)/cam.z;
  for(let n=DRAWN.length-1;n>=0;n--){const d=DRAWN[n];
    if(d.w){const[x,y]=P(d.w.u,d.w.v);if(Math.abs(wx-x)<10&&wy<y+3&&wy>y-30){greet(d.w);return}continue}
    if(!d.h||d.h<34)continue;const c=d.i%COLS,r=(d.i/COLS)|0;
    const[x,y]=d.big?P(CX+1,CY+1):P(c+.5,r+.5),hw=d.big?W2*1.9:W2*.62;
    if(wx>x-hw&&wx<x+hw&&wy>y-d.h-8&&wy<y+(d.big?H2*2:H2*.6)){tap(d.i);return}}
  const u=(wx/W2+wy/H2)/2,v=(wy/H2-wx/W2)/2,c=Math.floor(u),r=Math.floor(v);
  if(c<0||r<0||c>=COLS||r>=ROWS)return;tap(r*COLS+c);
}
function greet(w){w.bow=.6;w.talk=1.8;w.say=CHAT[Math.floor(Math.random()*CHAT.length)]}

function goalTarget(){
  const g=goalNow();if(!g||talking||!$('sheetBg').hidden||!$('lvup').hidden||!S.started)return null;
  if(goalReady())return $('goal');
  const find=fn=>{for(let i=0;i<S.tiles.length;i++){if(unlocked(i%COLS,(i/COLS)|0)&&fn(S.tiles[i],i))return{i}}return null};
  const grassNear=()=>{let best=null,bd=1e9;S.tiles.forEach((T,i)=>{const c=i%COLS,r=(i/COLS)|0;if(T.t!=='grass'||!unlocked(c,r))return;const d=Math.hypot(c-CX-.5,r-CY-2.5);if(d<bd){bd=d;best=i}});return best==null?null:{i:best}};
  switch(g.k){
    case'corn':return find(T=>T.t==='plot'&&cropState(T)==='ready')||find(T=>T.t==='plot'&&cropState(T)==='empty')||find(T=>T.t==='plot'&&cropState(T)==='grow');
    case'plots':return grassNear();
    case'mojo':return find(T=>T.t==='plot'&&cropState(T)==='grow')||find(T=>T.t==='plot'&&cropState(T)==='ready')||find(T=>T.t==='plot'&&cropState(T)==='empty');

}

/* ===== 왕국 목표(원작 Deluxe '목표' 방식, 3개씩) ===== */
const qProg=q=>Math.max(0,Math.min(q.n,stv(q.k)-q.base));
const qDone=q=>qProg(q)>=q.n;
const emptyCount=()=>cnt(T=>T.t==='grass');
function newQuest(){
  const lv=S.level,used=(S.quests||[]).map(q=>q.type);
  const has=c=>cnt(T=>T.t==='bld'&&BUILDS[T.b].cat===c&&bldState(T)!=='build')>0;
  const crops=Object.keys(CROPS).filter(k=>CROPS[k].lv<=lv&&CROPS[k].t<=6*H);
  const unbuilt=Object.keys(BUILDS).filter(k=>['house','shop'].includes(BUILDS[k].cat)&&BUILDS[k].lv<=lv&&!cnt(T=>T.t==='bld'&&T.b===k))
    .sort((a,b)=>BUILDS[a].cost-BUILDS[b].cost);
  const opts=[()=>{const n=8+lv*2;return{type:'harvest',k:'harvest',n,t:`작물 ${n}번 거두기`,ic:'wheat'}},
    ()=>{const n=3+Math.floor(lv/2);return{type:'deco',k:'deco',n,t:`장식 ${n}개 놓기`,ic:'tulip'}},
    ()=>{const n=4+lv;return{type:'road',k:'road',n,t:`길 ${n}칸 깔기`,ic:'road_dirt'}}];
  if(crops.length)opts.push(()=>{const c=crops[Math.floor(Math.random()*crops.length)],n=3+Math.floor(lv/3);return{type:'crop',k:'c_'+c,n,t:`${CROPS[c].n} ${n}번 거두기`,ic:c}});
  if(has('house'))opts.push(()=>{const n=4+lv;return{type:'tax',k:'tax',n,t:`세금 ${n}번 걷기`,ic:'coin'}});
  if(has('shop'))opts.push(()=>{const n=1+Math.floor(lv/8);return{type:'job',k:'job',n,t:`가게 상품 ${n}번 완성하기`,ic:'box'}});
  if(unbuilt.length)opts.push(()=>{const b=unbuilt[0];return{type:'build',k:'b_'+b,n:1,t:`${BUILDS[b].n} 짓기`,ic:b,bonus:Math.round(BUILDS[b].cost*.15)}});
  const pool=opts.filter((f,k)=>!used.includes(f().type));
  const q=(pool.length?pool:opts)[Math.floor(Math.random()*(pool.length||opts.length))]();
  q.base=stv(q.k);q.g=50+lv*35+(q.bonus||0);q.x=15+lv*10;q.mj=q.type==='build'?2:Math.random()<.25?1:0;
  return q;
}
function ensureQuests(){if(!S.quests)S.quests=[];while(S.quests.length<3)S.quests.push(newQuest())}
function openQuests(){
  ensureQuests();
  openSheet('왕국 목표',`<div class="qs">${S.quests.map((q,k)=>{const p=qProg(q),d=qDone(q);
    return`<div class="q"><span class="qi">${spr(q.ic)}</span><div class="qt"><b>${q.t}</b><span class="qbar"><i style="width:${Math.round(p/q.n*100)}%"></i></span>
    <div class="reward"><span>+${q.g.toLocaleString()}G</span><span>+${q.x}XP</span>${q.mj?`<span>모조 +${q.mj}</span>`:''}</div></div>
    <button class="btn ${d?'y':'w'}" data-act="qclaim" data-k="${k}" ${d?'':'disabled'}>${d?'받기':`${p}/${q.n}`}</button></div>`}).join('')}</div>
    <p class="sec">목표를 이루면 새 목표가 생겨요 · 빈 풀밭 ${emptyCount()}칸</p>`)}

$('sheet').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.k,b)});
function act(a,k,b){
  const T=S.tiles[sel];
  switch(a){
   case'tab':shopTab=k;openShop(!!b.dataset.here);return;
   case'plow':if(b.dataset.here){if(makePlot(sel))closeSheet()}else{startPlacing({kind:'plot'});return}break;
   case'plant':{const C=CROPS[k];if(!pay(C.cost))return;Object.assign(T,{crop:k,plantedAt:S.gt,readyAt:S.gt+C.t});
     pop(sel,C.cost?`-${C.cost}`:'심었어요',C.cost?'gd':'');closeSheet();break}
   case'buildHere':if(doBuild(sel,k))closeSheet();break;
   case'place':startPlacing({kind:'new',k});return;
   case'qclaim':{const q=S.quests[+k];if(!q||!qDone(q))return;S.gold+=q.g;S.mojo+=q.mj;closeSheet();pop(CI,`+${q.g}`,'gd');gainXP(q.x,CI);
     if(q.mj)pop(CI,`모조 +${q.mj}`,'mj',500);S.quests.splice(+k,1);S.quests.splice(+k,0,newQuest());save();render();setTimeout(openQuests,900);return}
   case'mojo':{const c=+k;if(S.mojo<c){toast('모조가 모자라요');return}S.mojo-=c;S.st.mojo++;finishNow(T);pop(sel,'뿅! 완성','mj');closeSheet();break}
   case'job':{const B=BUILDS[T.b];T.job={startAt:S.gt,doneAt:S.gt+B.jt};pop(sel,'일 시작!');closeSheet();break}
   case'clear':T.crop=null;closeSheet();break;
   case'move':startPlacing({kind:'move',from:sel});return;
   case'sell':{const B=BUILDS[T.b];S.gold+=Math.floor(B.cost/4);pop(sel,`+${Math.floor(B.cost/4)}`,'gd');S.tiles[sel]={t:'grass'};syncWalkers();closeSheet();break}
   case'expand':{const n=LANDS[S.land+1];if(!n||S.level<n.lv)return;if(!pay(n.cost))return;
     const up=n.n!==LANDS[S.land].n;S.land++;S.st.expand++;gainXP(Math.round(n.cost/20));toast(up?`${ro(n.n)} 업그레이드했어요!`:'왕국이 넓어졌어요!');if(up)confetti();closeSheet();resize();break}
   case'howto':closeSheet();{const g=goalNow();say([{t:g?g.d:'튜토리얼은 모두 끝났어요. 마음껏 왕국을 키워보세요!',btn:'알겠어요'}])}return;
   case'speed':S.speed=+k;save();render();openDev();return;
   case'gold':S.gold+=1000;break;
   case'mojo5':S.mojo+=5;break;
   case'lvup':gainXP(lvXp(S.level+1)-S.xp);closeSheet();break;
   case'starNow':S.star=null;S.nextStar=S.gt;starTick();closeSheet();toast('반짝별이 떨어졌어요! 찾아서 눌러보세요');break;
   case'daily':S.daily='';checkDaily();break;
   case'skip':S.gt+=H;starTick();toast('1시간이 지났어요');break;
   case'skipGoal':setGoal(GOALS.length);closeSheet();toast('튜토리얼을 건너뛰었어요');break;
   case'reset':if(!resetArm){resetArm=true;b.textContent='한 번 더 누르면 초기화';return}
     try{localStorage.removeItem(KEY)}catch(e){}S=fresh();closeSheet();syncWalkers();resize();render();showIntro();return;
  }
  save();render();
}

/* ===== 배치 모드 ===== */
function startPlacing(p){placing=p;closeSheet();
  const nm=p.kind==='plot'?'밭':p.kind==='move'?BUILDS[S.tiles[p.from].b].n:BUILDS[p.k].n;
  $('placeTxt').textContent=p.kind==='move'?`${nm}을(를) 옮길 풀밭을 눌러주세요`:`${nm} 놓을 풀밭을 눌러주세요`+(p.kind==='plot'||['deco','road','fence'].includes(BUILDS[p.k]?.cat)?' · 여러 개 가능':'');
  $('placeBar').hidden=false;render()}
function stopPlacing(){placing=null;$('placeBar').hidden=true}
$('placeCancel').onclick=()=>{stopPlacing();render()};
function placeAt(i){
  const p=placing;
  if(p.kind==='plot'){if(!makePlot(i))stopPlacing()}
  else if(p.kind==='move'){S.tiles[i]=S.tiles[p.from];S.tiles[p.from]={t:'grass'};pop(i,'옮겼어요');stopPlacing()}
  else{const ok=doBuild(i,p.k);if(!ok||!['deco','road','fence'].includes(BUILDS[p.k].cat))stopPlacing()}
  save();render();
}

/* ===== 탭 ===== */
function tap(i){
  if(talking)return;
  const c=i%COLS,r=(i/COLS)|0;sel=i;
  if(!unlocked(c,r)){stopPlacing();render();return openExpand()}
  const T=S.tiles[i];
  if(S.star&&S.star.i===i){
    S.star=null;S.mojo++;S.nextStar=S.gt+rnd(H,3*H);pop(i,'모조 +1','mj');toast('반짝별을 잡았어요! 모조 +1');save();render();return}
  if(placing){if(T.t==='grass')placeAt(i);else toast('빈 풀밭을 눌러주세요');return}
  if(T.t==='grass'){if(goalNow()?.k==='plots')shopTab='farm';return openShop(true)}
  if(T.t==='castle')return openCastle();
  if(T.t==='plot'){const s=cropState(T);
    if(s==='empty')return openSeeds();
    if(s==='ready'){harvest(i);save();render();return}
    if(s==='dead'){T.crop=null;pop(i,'시든 작물 정리');save();render();return}
    return openGrowing()}
  const s=bldState(T);
  if(s==='build')return openBuilding();
  if(s==='tax'){collectTax(i);save();render();return}
  if(s==='done'){collectJob(i);save();render();return}
  if(s==='open')return openJob();
  if(s==='work')return openWorking();
  if(s==='idle')return openTax();
  return openDeco();
}

    say([{t:`어서 오세요, ${who} 폐하! 저는 이 나라의 대신 몽실이에요.`},
         {t:`${S.name}은 아직 작고 조용하지만, 폐하와 함께라면 금방 북적북적해질 거예요.`},
         {t:'건국 기념으로 모조 10개를 드릴게요. 모조를 쓰면 기다리지 않고 바로 완성할 수 있어요.',extra:'<div class="reward"><span>모조 10</span></div>'},
         {t:GOALS[0].d,btn:'해볼게요!'}]);
  };
}

/* ===== 시계 ===== */
let lastSave=0;
function tick(){
  const now=Date.now();S.gt+=Math.max(0,(now-S.real)/1000)*S.speed;S.real=now;
  starTick();render();tickLive();
  if(now-lastSave>2000){save();syncWalkers();lastSave=now}
}
resize();syncWalkers();render();requestAnimationFrame(frame);
if(!S.started)showIntro();else checkDaily();
setInterval(tick,200);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script>
