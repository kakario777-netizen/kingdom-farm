<title>말랑 왕국</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 레이아웃: 상단 HUD 한 줄 + 하늘 위 떠 있는 섬(10×6 타일, 성은 2×2) + 아래에서 올라오는 시트·대신 대화창 */
:root{
  --sky:#bfe8ff; --sky2:#eaf8ff;
  --grass:#8fd16a; --grass2:#9ad874; --grass-dot:#a9e186; --island:#6db84e; --cliff:#c48a55; --cliff2:#9c6638;
  --soil:#c0824f; --soil-line:#a86c3e;
  --cream:#fff8e8; --paper:#ffffff;
  --ink:#5a3a28; --ink-soft:#8a6a55;
  --pink:#ff6f9f; --gold:#ffc93c; --mojo:#8b6cff; --mint:#4fcfa8;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  padding-block:6px;box-sizing:border-box;gap:6px}
button{font-family:var(--font);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--mojo);outline-offset:2px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--paper);border:2.5px solid var(--ink);
  border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:3px 10px 3px 4px;font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg{width:22px;height:22px}
.me{padding:2px 10px 2px 2px;cursor:pointer}
.me .face{width:30px;height:30px;border-radius:50%;background:#ffe9f1;border:2px solid var(--ink);overflow:hidden}
.me .face svg{width:100%;height:100%}
.me .nm{display:flex;flex-direction:column;line-height:1.05;font-size:13px}
.me .nm small{font-size:11px;color:var(--ink-soft)}
.lvnum{background:var(--pink);color:#fff;border-radius:999px;min-width:24px;height:24px;display:grid;
  place-items:center;font-size:13px;border:2px solid var(--ink)}
.xp{width:64px;height:10px;background:#f1e4d6;border-radius:99px;overflow:hidden;border:2px solid var(--ink)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#7fe0a0,#4fcfa8);width:0;transition:width .4s}
.clock{padding-left:10px;font-size:14px}
.clock em{font-style:normal;background:var(--mojo);color:#fff;border-radius:8px;padding:0 5px;font-size:12px}
.spacer{flex:1}
.btn{background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:14px;
  box-shadow:0 4px 0 var(--ink);padding:5px 12px;font-size:15px;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.y{background:var(--gold);color:var(--ink)}
.btn.w{background:var(--paper);color:var(--ink)}
.btn.m{background:var(--mojo)}
.btn.g{background:var(--mint);color:var(--ink)}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.btn.big{font-size:20px;padding:8px 26px;border-radius:18px}

/* 무대 */
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;border-radius:22px;overflow:hidden;
  background:linear-gradient(var(--sky2),var(--sky))}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-70%}
.cloud::after{width:40%;height:120%;left:48%;top:-45%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.stage::after{content:"";position:absolute;inset:0;background:#2a2470;opacity:0;pointer-events:none;transition:opacity 2s;z-index:4}
.stage.dusk::after{opacity:.14}
.stage.night::after{opacity:.3}
.isle{position:relative;z-index:1}
.board{--ts:52px;--gap:4px;position:relative;display:grid;grid-template-columns:repeat(10,var(--ts));grid-template-rows:repeat(6,var(--ts));gap:var(--gap);
  padding:10px;background:var(--island);border-radius:26px;
  box-shadow:0 7px 0 #5aa040,0 16px 0 var(--cliff),0 24px 0 var(--cliff2),0 34px 30px #3b7a2a40}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}

/* 타일 */
.tile{width:var(--ts);height:var(--ts);position:relative;border:0;padding:0;border-radius:24%;
  box-shadow:inset 0 -4px 0 #00000020}
.grass{background-color:var(--grass);
  background-image:radial-gradient(var(--grass-dot) 18%,transparent 20%);background-size:33% 33%}
.grass.alt{background-color:var(--grass2)}
.plot{background:repeating-linear-gradient(0deg,var(--soil) 0 17%,var(--soil-line) 17% 24%);
  box-shadow:inset 0 0 0 3px #00000012,inset 0 -4px 0 #00000025}
.locked{background:#e8f5fb;opacity:.5;box-shadow:inset 0 0 0 2px #ffffffaa}
.locked.next{opacity:.85;background:#f4fbff}
.lock{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--ts)*.42);color:#9cc3d6}
.tile>svg{position:absolute;left:4%;top:0;width:92%;height:92%;overflow:visible}
.tile .fl{position:absolute;width:30%;height:30%;left:var(--fx);top:var(--fy)}
.s0{transform:scale(.5) translateY(36%)}
.s1{transform:scale(.66) translateY(16%)}
.s2{transform:scale(.84) translateY(4%)}
.bob{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%) scale(1.04)}}
.ready{box-shadow:inset 0 0 0 3px #fff6a8,inset 0 -4px 0 #00000020}
.dead{filter:saturate(.4)}
.bar{position:absolute;left:12%;right:12%;bottom:6%;height:10%;background:#5a3a2866;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff3a6;border-radius:99px}
.badge{position:absolute;top:-14%;right:-12%;width:48%;height:48%;background:var(--paper);border-radius:50%;
  border:2px solid var(--ink);display:grid;place-items:center;animation:bob 1.1s ease-in-out infinite;z-index:2}
.badge svg{width:78%;height:78%}
.sign{position:absolute;right:-6%;bottom:-4%;width:46%;height:46%;z-index:2}
.sign svg{width:100%;height:100%}
.star{position:absolute;left:-10%;top:-12%;width:55%;height:55%;z-index:2;animation:twinkle 1s ease-in-out infinite}
.star svg{width:100%;height:100%}
@keyframes twinkle{50%{transform:rotate(14deg) scale(1.18)}}
.can{outline:3px dashed #fff;outline-offset:-5px}
.blade{transform-origin:20px 15px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 성 (2×2) */
.castle{grid-area:1/1/3/3;position:relative;border:0;padding:0;background:transparent;z-index:2}
.castle>svg{position:absolute;left:-4%;top:-14%;width:108%;height:112%;overflow:visible}
.castle .badge{top:-10%;right:-4%;width:28%;height:28%}

/* 주민 */
.walkers{position:absolute;inset:0;pointer-events:none;z-index:3}
.walker{position:absolute;width:calc(var(--ts)*.42);height:calc(var(--ts)*.5);pointer-events:auto;cursor:pointer;
  transition-property:left,top;transition-timing-function:linear}
.walker svg{width:100%;height:100%;overflow:visible}
.walker.go svg{animation:step .38s ease-in-out infinite}
.walker.flip svg{transform:scaleX(-1)}
.walker.flip.go svg{animation:stepf .38s ease-in-out infinite}
@keyframes step{50%{transform:translateY(-10%)}}
@keyframes stepf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-10%)}}
.walker.bow svg{animation:bow .6s ease-in-out}
@keyframes bow{40%{transform:rotate(-18deg) translateY(8%)}}
.bubble{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);
  border-radius:12px;padding:2px 8px;font-size:13px;white-space:nowrap;animation:slide .2s ease-out}

/* 떠오르는 숫자 */
.pop{position:absolute;font-size:17px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  white-space:nowrap;transform:translate(-50%,0);animation:up 1.1s ease-out forwards}
.pop.gd{color:var(--gold)} .pop.mj{color:#c7b6ff} .pop.xp{color:#9df0c0}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}
 100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}

/* 목표 카드 */
.goal{position:absolute;left:10px;top:10px;z-index:6;display:flex;align-items:center;gap:8px;max-width:min(300px,60%);
  background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:5px 10px 5px 5px;text-align:left}
.goal .gi{width:34px;height:34px;flex:none;background:#fff1c9;border-radius:10px;border:2px solid var(--ink)}
.goal .gi svg{width:100%;height:100%}
.goal b{font-weight:400;font-size:14px;display:block}
.goal small{font-size:12px;color:var(--ink-soft)}
.hand{position:fixed;z-index:8;width:40px;height:40px;pointer-events:none;animation:poke .8s ease-in-out infinite;transition:left .25s,top .25s}
.hand svg{width:100%;height:100%}
@keyframes poke{50%{transform:translateY(-10px)}}

.hint{display:none;margin:0;text-align:center;font-size:13px;color:var(--ink-soft)}
@media (orientation:portrait) and (max-width:700px){.hint{display:block}}

/* 시트 */
.sheet-bg{position:fixed;inset:0;background:#3a24184d;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:min(780px,100%);max-height:80%;overflow:auto;box-sizing:border-box;
  border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:slide .22s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sheet h2{margin:0;font-size:20px;font-weight:400;flex:1;text-wrap:balance}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:2.5px solid var(--ink);background:var(--paper);border-radius:12px;padding:4px 12px;font-size:15px}
.tab.on{background:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.card{position:relative;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);
  padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.card:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card:disabled{opacity:.55;cursor:default}
.card .pic{width:54px;height:54px}
.card .pic svg{width:100%;height:100%;overflow:visible}
.card b{font-weight:400;font-size:15px}
.card small{font-size:12px;color:var(--ink-soft)}
.card .earn{font-size:12px;color:#d9822b}
.card .lockb{position:absolute;top:6px;right:6px;background:var(--ink);color:#fff;font-size:11px;border-radius:8px;padding:1px 5px}
.info{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.info .pic{width:84px;height:84px;flex:none;background:var(--grass);border-radius:22px;border:2.5px solid var(--ink)}
.info .pic svg{width:100%;height:100%;overflow:visible}
.info .txt{flex:1;min-width:170px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.info .big{font-size:22px}
.info .sub{font-size:13px;color:var(--ink-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.list{margin:0;padding-left:18px;font-size:14px;line-height:1.7}
.sec{font-size:14px;color:var(--ink-soft);margin:14px 0 6px}

/* 대신 대화창 */
.talk{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;align-items:flex-end;gap:10px;justify-content:center;pointer-events:none}
.talk .who{width:92px;height:92px;flex:none;animation:bob 1.6s ease-in-out infinite}
.talk .who svg{width:100%;height:100%}
.talk .box{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);
  padding:10px 14px;max-width:560px;flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;animation:slide .2s ease-out}
.talk .box b{font-weight:400;color:var(--pink);font-size:14px}
.talk .box p{margin:0;font-size:17px;line-height:1.45}
.talk .box .row{justify-content:flex-end;margin:0}
.reward{display:flex;gap:8px;flex-wrap:wrap}
.reward span{background:#fff4d0;border:2px solid var(--ink);border-radius:10px;padding:1px 8px;font-size:14px}

/* 오프닝 */
.intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:radial-gradient(circle at 50% 120%,#a3e17f 0 30%,transparent 31%),linear-gradient(#ffe0ee,#cfeeff);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
.intro h1{margin:0;font-weight:400;font-size:clamp(40px,9vw,72px);color:var(--pink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--ink);letter-spacing:.02em}
.intro .art{width:min(200px,36vh);height:min(200px,36vh)}
.intro .art svg{width:100%;height:100%;overflow:visible}
.intro p{margin:0;font-size:17px}
.rulers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ruler{width:96px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:6px;display:flex;flex-direction:column;align-items:center;font-size:15px}
.ruler svg{width:70px;height:70px}
.ruler.on{background:#fff1c9;transform:translateY(-4px)}
.namein{font-family:var(--font);font-size:22px;color:var(--ink);text-align:center;border:3px solid var(--ink);border-radius:16px;padding:6px 12px;width:min(280px,80vw);
  user-select:text;-webkit-user-select:text;background:var(--paper)}

/* 레벨업 */
.lvup{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:#3a24185c;padding:16px;box-sizing:border-box}
.lvcard{background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:18px 22px;max-width:440px;width:100%;
  text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:popin .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{from{transform:scale(.5);opacity:0}}
.lvcard h3{margin:0;font-weight:400;font-size:30px;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.unl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.unl div{width:74px;font-size:12px;display:flex;flex-direction:column;align-items:center}
.unl svg{width:46px;height:46px;overflow:visible}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:26;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;
  background:var(--ink);color:#fff;border-radius:16px;padding:8px 16px;font-size:15px;max-width:86vw;text-align:center;animation:slide .2s ease-out}
.placebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;
  background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);
  padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;font-size:15px;white-space:nowrap;max-width:94vw}
.placebar span{overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="hud">
    <button class="chip me" id="meBtn"><span class="face" id="meFace"></span><span class="nm"><span id="kName">말랑 왕국</span><small id="kSub">레벨 1</small></span></button>
    <div class="chip"><span class="lvnum" id="lvNum">1</span><div class="xp"><i id="xpFill"></i></div></div>
    <div class="chip"><span id="icGold"></span><b id="gold">0</b></div>
    <div class="chip"><span id="icMojo"></span><b id="mojo">0</b></div>
    <div class="chip clock"><span id="clock"></span><em id="spd"></em></div>
    <span class="spacer"></span>
    <button class="btn y" id="allBtn" hidden>모두 거두기</button>
    <button class="btn" id="shopBtn">상점</button>
    <button class="btn w" id="devBtn">테스트</button>
  </header>
  <main class="stage" id="stage">
    <div class="cloud" style="width:120px;height:34px;top:12%;animation-duration:70s;animation-delay:-20s"></div>
    <div class="cloud" style="width:90px;height:26px;top:70%;animation-duration:90s;animation-delay:-60s"></div>
    <div class="cloud" style="width:150px;height:40px;top:40%;animation-duration:110s;animation-delay:-5s;opacity:.6"></div>
    <div class="isle"><div class="board" id="board"><div class="walkers" id="walkers"></div></div></div>
    <button class="goal" id="goal" hidden><span class="gi" id="goalIc"></span><span><b id="goalT"></b><small id="goalP"></small></span></button>
    <div class="fx" id="fx"></div>
  </main>
  <p class="hint">폰을 가로로 돌리면 왕국이 더 크게 보여요</p>
</div>
<div class="hand" id="hand" hidden></div>
<div class="sheet-bg" id="sheetBg" hidden><section class="sheet" id="sheet">
  <header><h2 id="shTitle"></h2><button class="btn w" id="shClose">닫기</button></header>
  <div id="shBody"></div>
</section></div>
<div class="talk" id="talk" hidden><div class="who" id="talkWho"></div><div class="box"><b id="talkName">몽실 대신</b><p id="talkTxt"></p><div id="talkExtra"></div><div class="row"><button class="btn" id="talkBtn">다음</button></div></div></div>
<div class="placebar" id="placeBar" hidden><span id="placeTxt"></span><button class="btn w" id="placeCancel">그만</button></div>
<div class="lvup" id="lvup" hidden><div class="lvcard"><h3 id="lvT"></h3><div id="lvB"></div><button class="btn y big" id="lvOk">좋아요!</button></div></div>
<div class="intro" id="intro" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 시간 설정 =====
   개발 중: DEV=true, 기본 20배속 (게임 1시간 = 실제 3분)
   최종 빌드: DEV=false 로 바꾸면 리얼타임(×1) + 테스트 버튼 숨김 */
const DEV = true;
const DEV_SPEED = 20;
const VERSION = 'v0.2';

const COLS=10, ROWS=6, M=60, H=3600, DAY=86400;

/* ===== 원작 위룰 기준 데이터 =====
   작물: 원작 표 그대로(해금 레벨·씨앗값·시간·골드·경험치)
   레벨: 원작 누적 경험치 표, 레벨업 모조 보상 */
const CROPS={
  corn:{n:'옥수수',lv:1,cost:0,t:45,g:5,x:1},
  wheat:{n:'밀',lv:1,cost:5,t:5*M,g:25,x:8},
  onion:{n:'양파',lv:3,cost:25,t:1*H,g:125,x:40},
  berry:{n:'딸기',lv:4,cost:30,t:1.5*H,g:150,x:50},
  beans:{n:'콩',lv:4,cost:85,t:DAY,g:425,x:140},
  squash:{n:'애호박',lv:5,cost:45,t:5*H,g:225,x:75},
  carrot:{n:'당근',lv:6,cost:65,t:12*H,g:325,x:105},
  pumpkin:{n:'호박',lv:9,cost:40,t:3*H,g:200,x:65},
  potato:{n:'감자',lv:10,cost:50,t:6*H,g:250,x:80},
  asparagus:{n:'마법 아스파라거스',lv:11,cost:400,t:12*H,g:1200,x:250},
  peas:{n:'완두콩',lv:12,cost:20,t:30*M,g:100,x:33},

/* ===== 상태 ===== */
const KEY='malang-kingdom-v2';
function fresh(){
  const tiles=Array.from({length:COLS*ROWS},()=>({t:'grass'}));
  const at=(c,r)=>r*COLS+c;
  for(const i of[at(0,0),at(1,0),at(0,1),at(1,1)])tiles[i]={t:'castle'};
  for(const c of[0,1,2])tiles[at(c,3)]={t:'plot'};
  return {v:2,gt:8*H,real:Date.now(),gold:250,xp:0,level:1,mojo:10,land:0,speed:DEV?DEV_SPEED:1,
    tiles,star:null,nextStar:8*H+40*M,daily:'',name:'말랑 왕국',ruler:'king',started:false,
    goal:0,gbase:0,st:{corn:0,plots:0,mojo:0,pine:0,cottage:0,tax:0,expand:0}};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
if(!DEV)S.speed=1;
S.gt+=Math.max(0,(Date.now()-S.real)/1000)*S.speed;   // 앱을 꺼둔 동안에도 시간이 흘러요
S.real=Date.now();

let sel=-1, placing=null, liveFn=null, resetArm=false, shopTab='house', talking=false;
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(1,v));
const prog=(a,b)=>b<=a?1:clamp((S.gt-a)/(b-a));
const rnd=(a,b)=>a+Math.random()*(b-a);
const unlocked=(c,r)=>c<LANDS[S.land].w&&r<LANDS[S.land].h;
const isNext=(c,r)=>{const n=LANDS[S.land+1];return n&&c<n.w&&r<n.h};
const lvXp=l=>LV_XP[l]??(LV_XP[LV_XP.length-1]+(l-LV_XP.length+1)*120000);
const cnt=fn=>S.tiles.filter((T,i)=>unlocked(i%COLS,(i/COLS)|0)&&fn(T)).length;

function fmt(s){s=Math.max(0,Math.ceil(s));
  if(s>=DAY){const d=Math.floor(s/DAY),h=Math.floor(s%DAY/H);return h?`${d}일 ${h}시간`:`${d}일`}
  if(s>=H){const h=Math.floor(s/H),m=Math.floor(s%H/M);return m?`${h}시간 ${m}분`:`${h}시간`}
  if(s>=M){const m=Math.floor(s/M),x=s%M;return x&&m<10?`${m}분 ${x}초`:`${m}분`}
  return `${s}초`}
const remain=s=>fmt(s)+(S.speed!==1?` · 실제 ${fmt(s/S.speed)}`:'');
/* 원작: 12시간 이상 남으면 모조 8개, 남은 시간이 줄수록 싸짐 */
const mojoCost=rem=>Math.max(1,Math.min(8,Math.ceil(rem/(1.5*H))));

function cropState(T){
  if(!T.crop)return'empty';
  if(S.gt<T.readyAt)return'grow';
  const C=CROPS[T.crop],spoil=Math.max(C.t*1.5,20*M);
  return S.gt<T.readyAt+spoil?'ready':'dead';
}
function bldState(T){
  const B=BUILDS[T.b];
  if(S.gt<T.doneAt)return'build';
  if(B.cat==='house')return S.gt>=T.taxAt?'tax':'idle';
  if(B.cat==='shop'){if(!T.job)return'open';return S.gt>=T.job.doneAt?'done':'work'}
  return'deco';
}
function remainOf(T){
  if(T.t==='plot')return T.readyAt-S.gt;
  const s=bldState(T);
  if(s==='build')return T.doneAt-S.gt;
  if(s==='work')return T.job.doneAt-S.gt;
  if(s==='idle')return T.taxAt-S.gt;
  return 0;
}

/* ===== 판 그리기 ===== */
const board=$('board'), stage=$('stage'), fx=$('fx'), walkersEl=$('walkers');
const cache=[];
for(let i=0;i<COLS*ROWS;i++){const d=document.createElement('button');d.className='tile';d.dataset.i=i;
  d.style.gridColumn=(i%COLS)+1;d.style.gridRow=((i/COLS)|0)+1;board.appendChild(d);cache.push({el:d,sig:null})}
const castleEl=document.createElement('button');castleEl.className='castle';castleEl.dataset.i=0;board.appendChild(castleEl);
let castleSig='';
const bar=p=>`<span class="bar"><i style="width:${Math.round(p*100)}%"></i></span>`;
const badge=n=>`<span class="badge">${spr(n)}</span>`;
const hash=i=>((i*2654435761)>>>0)%100;
function flowers(i){const h=hash(i);if(h>28)return'';
  const c=['#ffffff','#ffd84a','#ff8fb0'][h%3];
  return`<svg class="fl" style="--fx:${10+h%55}%;--fy:${12+(h*7)%55}%" viewBox="0 0 10 10"><g fill="${c}"><circle cx="5" cy="2.6" r="2"/><circle cx="7.4" cy="5" r="2"/><circle cx="5" cy="7.4" r="2"/><circle cx="2.6" cy="5" r="2"/></g><circle cx="5" cy="5" r="1.6" fill="#ffb02e"/></svg>`}

function tileView(i){
  const c=i%COLS,r=(i/COLS)|0,T=S.tiles[i];
  if(T.t==='castle')return{sig:'C',cls:'tile',html:'',hide:true};
  if(!unlocked(c,r)){const n=isNext(c,r);return{sig:'L'+n,cls:'tile locked'+(n?' next':''),html:n?'<span class="lock">+</span>':''}}
  let cls='tile',html='',sig=T.t;
  if(T.t==='grass'){cls+=' grass'+(hash(i)%2?' alt':'');html=flowers(i)}
  else if(T.t==='plot'){
    cls+=' plot';const s=cropState(T);sig+=s+T.crop;
    if(s==='grow'){const p=prog(T.plantedAt,T.readyAt),g=p<.34?0:p<.72?1:2;sig+=g+'|'+Math.floor(p*30);
      html=(g===0?spr('sprout','s0'):spr(T.crop,'s'+g))+bar(p)}
    else if(s==='ready'){cls+=' ready';html=spr(T.crop,'bob')+badge('coin')}
    else if(s==='dead'){cls+=' dead';html=spr('wither')}
  }else{
    cls+=' grass'+(hash(i)%2?' alt':'');const s=bldState(T),B=BUILDS[T.b];sig+=T.b+s;
    if(s==='build'){const p=prog(T.startAt,T.doneAt);sig+=Math.floor(p*30);html=spr('build')+bar(p)}
    else{html=spr(T.b);
      if(s==='tax'||s==='done'){cls+=' ready';html=spr(T.b,'bob')+badge(s==='tax'?'coin':'box')}
      else if(s==='work'){const p=prog(T.job.startAt,T.job.doneAt);sig+=Math.floor(p*30);html+=bar(p)+badge('dots')}
      else if(s==='open'){html+=`<span class="sign">${spr('open')}</span>`}
      else if(s==='idle'){const p=prog(T.taxAt-B.every,T.taxAt);sig+=Math.floor(p*30);html+=bar(p)}}
  }
  if(S.star&&S.star.i===i){sig+='*';html+=`<span class="star">${spr('star')}</span>`}
  if(placing&&T.t==='grass'){cls+=' can';sig+='p'}
  return{sig,cls,html};
}
function render(){
  for(let i=0;i<cache.length;i++){const v=tileView(i),e=cache[i];
    if(v.sig!==e.sig||v.cls!==e.cls){e.el.className=v.cls;e.el.innerHTML=v.html;e.el.style.visibility=v.hide?'hidden':'';e.sig=v.sig;e.cls=v.cls}}
  const cs='T'+castleTier();
  if(cs!==castleSig){castleSig=cs;castleEl.innerHTML=castleSvg(castleTier())}
  $('lvNum').textContent=S.level;
  const a=lvXp(S.level),b=lvXp(S.level+1);
  $('xpFill').style.width=Math.round(clamp((S.xp-a)/(b-a))*100)+'%';
  $('gold').textContent=Math.floor(S.gold).toLocaleString();
  $('mojo').textContent=S.mojo;
  if($('meFace').dataset.k!==S.ruler){$('meFace').dataset.k=S.ruler;$('meFace').innerHTML=spr(S.ruler)}
  $('kName').textContent=S.name;$('kSub').textContent=`${RULERS.find(x=>x.k===S.ruler).n} · ${LANDS[S.land].n}`;
  const day=Math.floor(S.gt/DAY)+1,h=Math.floor(S.gt%DAY/H),m=Math.floor(S.gt%H/M);
  $('clock').textContent=`${day}일차 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  $('spd').textContent=S.speed!==1?`×${S.speed}`:'';$('spd').hidden=S.speed===1;
  stage.classList.toggle('night',h<5||h>=20);stage.classList.toggle('dusk',h===5||h===19);
  $('allBtn').hidden=readyCount()===0;
  renderGoal();
}
function readyCount(){return cnt(T=>(T.t==='plot'&&cropState(T)==='ready')||(T.t==='bld'&&['tax','done'].includes(bldState(T))))}

let TS=52,GAP=4;
function resize(){
  const r=stage.getBoundingClientRect(),gap=r.width<520?3:4;
  const ts=Math.floor(Math.min((r.width-28-gap*(COLS-1))/COLS,(r.height-64-gap*(ROWS-1))/ROWS));
  TS=Math.max(24,Math.min(96,ts));GAP=gap;
  board.style.setProperty('--ts',TS+'px');board.style.setProperty('--gap',gap+'px');
  walkers.forEach(w=>place(w,w.x,w.y,0));
}
addEventListener('resize',resize);

/* ===== 주민 ===== */
const walkers=[];
const tileXY=(c,r)=>({x:10+c*(TS+GAP),y:10+r*(TS+GAP)});
function place(w,c,r,dur){w.x=c;w.y=r;const p=tileXY(c,r);
  w.el.style.transitionDuration=dur+'s';w.el.style.left=(p.x+TS*w.ox)+'px';w.el.style.top=(p.y+TS*w.oy)+'px'}
function syncWalkers(){
  const want=Math.min(14,cnt(T=>T.t==='bld'&&BUILDS[T.b].cat==='house'&&bldState(T)!=='build')*2+cnt(T=>T.t==='bld'&&BUILDS[T.b].cat==='shop'&&bldState(T)!=='build'));
  while(walkers.length<want){
    const el=document.createElement('div');el.className='walker';const n=walkers.length;
    el.innerHTML=villager(VCOL[n%VCOL.length],n%3===0?VCOL[(n+3)%VCOL.length]:null);
    const w={el,x:2,y:2,ox:rnd(.1,.5),oy:rnd(0,.4),next:0};
    el.onclick=e=>{e.stopPropagation();greet(w)};
    walkersEl.appendChild(el);walkers.push(w);
    const L=LANDS[S.land];place(w,Math.floor(rnd(2,L.w)),Math.floor(rnd(0,L.h)),0);
  }
  while(walkers.length>want){walkers.pop().el.remove()}
}
function walkTick(){
  const now=performance.now(),L=LANDS[S.land];
  for(const w of walkers){
    if(now<w.next)continue;
    if(w.el.classList.contains('go')){w.el.classList.remove('go');w.next=now+rnd(1500,4500);continue}
    const c=Math.max(0,Math.min(L.w-1,w.x+Math.round(rnd(-2,2)))),r=Math.max(0,Math.min(L.h-1,w.y+Math.round(rnd(-2,2))));
    if(S.tiles[r*COLS+c].t==='castle')continue;
    const d=Math.hypot(c-w.x,r-w.y);if(!d){w.next=now+1000;continue}
    w.el.classList.toggle('flip',c<w.x);w.ox=rnd(.1,.5);w.oy=rnd(0,.4);
    const dur=d*1.4;place(w,c,r,dur);w.el.classList.add('go');w.next=now+dur*1000;
  }
}
function greet(w){
  w.el.classList.remove('bow');void w.el.offsetWidth;w.el.classList.add('bow');
  const b=document.createElement('div');b.className='bubble';b.textContent=CHAT[Math.floor(Math.random()*CHAT.length)];
  w.el.querySelector('.bubble')?.remove();w.el.appendChild(b);setTimeout(()=>b.remove(),1800);
}

/* ===== 효과 ===== */
function pop(i,text,cls='',delay=0){
  setTimeout(()=>{const el=S.tiles[i]?.t==='castle'?castleEl:cache[i].el;const t=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
    const d=document.createElement('div');d.className='pop '+cls;d.textContent=text;
    d.style.left=(t.left-s.left+t.width/2)+'px';d.style.top=(t.top-s.top)+'px';
    fx.appendChild(d);setTimeout(()=>d.remove(),1200)},delay)}
let toastT;
function toast(msg,ms=2200){const t=$('toast');t.textContent=msg;t.hidden=false;
  t.style.animation='none';t.offsetHeight;t.style.animation='';clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
function confetti(){const cs=['#ff6f9f','#ffc93c','#4fcfa8','#8b6cff','#6cc7ff'];
  for(let k=0;k<40;k++){const d=document.createElement('i');d.className='conf';d.style.left=rnd(0,100)+'vw';d.style.background=cs[k%5];
    d.style.animationDelay=rnd(0,.5)+'s';d.style.animationDuration=rnd(1.4,2.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}

/* ===== 경제 ===== */
function pay(n){if(S.gold<n){toast(`골드가 ${n-Math.floor(S.gold)} 모자라요`);return false}S.gold-=n;return true}
const lvQueue=[];
function gainXP(x,i){
  S.xp+=x;if(i!=null)pop(i,`+${x} XP`,'xp',260);
  while(S.xp>=lvXp(S.level+1)){S.level++;const mj=LV_MOJO[S.level]||3;S.mojo+=mj;lvQueue.push({lv:S.level,mj})}
  if(lvQueue.length&&$('lvup').hidden)setTimeout(showLevelUp,450);
}
function showLevelUp(){
  const q=lvQueue.shift();if(!q)return;
  const un=[...Object.entries(CROPS).map(([k,o])=>({k,o})),...Object.entries(BUILDS).map(([k,o])=>({k,o}))].filter(e=>e.o.lv===q.lv);
  const ln=LANDS.find(l=>l.lv===q.lv&&l.cost);
  $('lvT').textContent=`레벨 ${q.lv}!`;
  $('lvB').innerHTML=`<div class="reward" style="justify-content:center"><span>모조 +${q.mj}</span>${q.lv%2===0?'<span>밭 한도 +1</span>':''}</div>`+
    (un.length||ln?`<p class="sec">새로 열렸어요</p><div class="unl">${un.map(e=>`<div>${spr(e.k)}${e.o.n}</div>`).join('')}${ln?`<div>${spr('land')}${ln.n} 넓히기</div>`:''}</div>`:'');
  $('lvup').hidden=false;confetti();
}
$('lvOk').onclick=()=>{$('lvup').hidden=true;if(lvQueue.length)setTimeout(showLevelUp,200)};

function harvest(i){const T=S.tiles[i],C=CROPS[T.crop];S.gold+=C.g;pop(i,`+${C.g}`,'gd');if(T.crop==='corn')S.st.corn++;gainXP(C.x,i);T.crop=null}
function collectTax(i){const T=S.tiles[i],B=BUILDS[T.b];S.gold+=B.g;pop(i,`+${B.g}`,'gd');S.st.tax++;gainXP(Math.max(1,Math.round(B.g/10)),i);T.taxAt=S.gt+B.every}
function collectJob(i){const T=S.tiles[i],B=BUILDS[T.b];S.gold+=B.g;pop(i,`+${B.g}`,'gd');gainXP(B.jx,i);T.job=null}
function collectAll(){let n=0;S.tiles.forEach((T,i)=>{if(!unlocked(i%COLS,(i/COLS)|0))return;
  if(T.t==='plot'&&cropState(T)==='ready'){harvest(i);n++}
  else if(T.t==='bld'){const s=bldState(T);if(s==='tax'){collectTax(i);n++}else if(s==='done'){collectJob(i);n++}}});
  if(n)toast(`${n}곳을 한 번에 거뒀어요`);save();render()}
function makePlot(i){
  if(cnt(T=>T.t==='plot')>=plotCap()){toast(`밭은 지금 ${plotCap()}개까지예요. 레벨이 오르면 늘어나요`);return false}
  if(!pay(PLOT_COST))return false;
  S.tiles[i]={t:'plot'};S.st.plots++;pop(i,`-${PLOT_COST}`,'gd');gainXP(5,i);return true;
}
function doBuild(i,k){
  const B=BUILDS[k];if(S.level<B.lv){toast(`레벨 ${B.lv}부터 지을 수 있어요`);return false}
  if(!pay(B.cost))return false;
  const T={t:'bld',b:k,startAt:S.gt,doneAt:S.gt+B.t};if(B.cat==='house')T.taxAt=T.doneAt+B.every;
  S.tiles[i]=T;pop(i,`-${B.cost}`,'gd');gainXP(B.x,i);
  if(k==='pine')S.st.pine++;if(B.cat==='house')S.st.cottage++;
  if(B.t)toast(`${B.n} 공사 시작! ${fmt(B.t)} 뒤에 완성돼요`);
  syncWalkers();return true;
}
function finishNow(T){
  if(T.t==='plot')T.readyAt=S.gt;
  else{const s=bldState(T),B=BUILDS[T.b];
    if(s==='build'){T.doneAt=S.gt;if(B.cat==='house')T.taxAt=S.gt+B.every}
    else if(s==='work')T.job.doneAt=S.gt;
    else if(s==='idle')T.taxAt=S.gt}
}

/* ===== 이벤트(모조 얻는 곳) ===== */
const today=()=>{const d=new Date();return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
function checkDaily(){if(S.daily!==today()){S.daily=today();S.mojo+=2;setTimeout(()=>toast('오늘의 출석 선물! 모조 +2',3000),600);save()}}
function starTick(){
  if(S.star&&S.gt>S.star.exp){S.star=null;S.nextStar=S.gt+rnd(H,3*H)}
  if(!S.star&&S.gt>=S.nextStar){
    const ok=[];S.tiles.forEach((T,i)=>{if(unlocked(i%COLS,(i/COLS)|0)&&T.t!=='castle')ok.push(i)});
    S.star={i:ok[Math.floor(Math.random()*ok.length)],exp:S.gt+40*M}}
}

/* ===== 목표(튜토리얼) ===== */
const goalNow=()=>GOALS[S.goal];
const goalProg=()=>{const g=goalNow();return g?Math.min(g.n,S.st[g.k]-S.gbase):0};
const goalReady=()=>{const g=goalNow();return g&&goalProg()>=g.n};
function setGoal(n){S.goal=n;const g=goalNow();if(g)S.gbase=S.st[g.k];save()}
function renderGoal(){
  const g=goalNow(),el=$('goal');
  if(!g||!S.started){el.hidden=true;return}
  el.hidden=false;const sig=S.goal+'|'+goalProg();
  if(el.dataset.sig!==sig){el.dataset.sig=sig;$('goalIc').innerHTML=spr(g.ic);$('goalT').textContent=g.t;
    $('goalP').textContent=goalReady()?'완료! 눌러서 보상 받기':`${goalProg()} / ${g.n}`}
}
function goalTarget(){
  const g=goalNow();if(!g||talking||!$('sheetBg').hidden||!$('lvup').hidden||!S.started)return null;
  if(goalReady())return $('goal');
  const find=fn=>{for(let i=0;i<S.tiles.length;i++){if(unlocked(i%COLS,(i/COLS)|0)&&fn(S.tiles[i],i))return cache[i].el}return null};
  const grassNear=()=>find((T,i)=>T.t==='grass'&&((i/COLS)|0)>=2&&i%COLS<=4)||find(T=>T.t==='grass');
  switch(g.k){
    case'corn':return find(T=>T.t==='plot'&&cropState(T)==='ready')||find(T=>T.t==='plot'&&cropState(T)==='empty')||find(T=>T.t==='plot'&&cropState(T)==='grow');
    case'plots':return grassNear();
    case'mojo':return find(T=>T.t==='plot'&&cropState(T)==='grow')||find(T=>T.t==='plot'&&cropState(T)==='ready')||find(T=>T.t==='plot'&&cropState(T)==='empty');
    case'pine':case'cottage':return placing?grassNear():$('shopBtn');
    case'tax':return find(T=>T.t==='bld'&&bldState(T)==='tax')||find(T=>T.t==='bld'&&bldState(T)==='build')||find(T=>T.t==='bld'&&BUILDS[T.b].cat==='house');
    case'expand':return castleEl;
  }
  return null;
}
function updateHand(){
  const t=goalTarget(),h=$('hand');
  if(!t){h.hidden=true;return}
  const r=t.getBoundingClientRect();h.hidden=false;
  h.style.left=(r.left+r.width/2-8)+'px';h.style.top=(r.top+r.height*.55)+'px';
}
function claimGoal(){
  const g=goalNow();if(!g||!goalReady())return;
  const rw=`<div class="reward">${g.g?`<span>+${g.g} 골드</span>`:''}<span>+${g.x} XP</span></div>`;
  say([{t:`훌륭해요, 폐하! '${g.t}' 완료예요.`,extra:rw,btn:'받기',fn:()=>{
    S.gold+=g.g||0;pop(0,g.g?`+${g.g}`:'목표 완료','gd');gainXP(g.x,0);setGoal(S.goal+1);
    const n=goalNow();
    if(n)say([{t:n.d,btn:'알겠어요'}]);
    else say([{t:'기본은 모두 익히셨어요! 이제 이 왕국은 온전히 폐하의 것이에요.'},{t:'레벨이 오르면 새 작물과 가게가 열려요. 가게를 지으면 상품을 만들어 큰돈을 벌 수 있답니다.',btn:'시작!'}]);
    save();render();
  }}]);
}
$('goal').onclick=()=>{if(goalReady())claimGoal();else{const g=goalNow();if(g)say([{t:g.d,btn:'알겠어요'}])}};

/* ===== 대신 대화 ===== */
let talkQ=[];
function say(lines){talkQ.push(...lines);if(!talking)nextTalk()}
function nextTalk(){
  const L=talkQ.shift();
  if(!L){talking=false;$('talk').hidden=true;return}
  talking=true;$('talk').hidden=false;$('talkWho').innerHTML=spr('advisor');
  $('talkTxt').textContent=L.t;$('talkExtra').innerHTML=L.extra||'';$('talkBtn').textContent=L.btn||'다음';
  $('talkBtn').onclick=()=>{L.fn&&L.fn();nextTalk()};
}

/* ===== 시트 ===== */
function openSheet(title,html,live){$('shTitle').textContent=title;$('shBody').innerHTML=html;$('sheetBg').hidden=false;liveFn=live||null;if(liveFn)tickLive()}
function closeSheet(){$('sheetBg').hidden=true;liveFn=null;resetArm=false}
$('shClose').onclick=closeSheet;
$('sheetBg').addEventListener('click',e=>{if(e.target===$('sheetBg'))closeSheet()});
function tickLive(){const el=$('live');if(el&&liveFn)el.textContent=liveFn()}

const lockb=lv=>S.level<lv?`<span class="lockb">Lv.${lv}</span>`:'';
function cropCard(k){const C=CROPS[k];
  return`<button class="card" data-act="plant" data-k="${k}" ${S.level<C.lv?'disabled':''}>${lockb(C.lv)}
  <span class="pic">${spr(k)}</span><b>${C.n}</b><small>${fmt(C.t)} · ${C.cost?C.cost+'G':'무료'}</small>
  <span class="earn">+${C.g}G · +${C.x}XP</span></button>`}
function bldCard(k,act){const B=BUILDS[k];
  const earn=B.cat==='house'?B.d:B.cat==='shop'?`${B.item} · ${fmt(B.jt)} · +${B.g}G`:`+${B.x}XP`;
  return`<button class="card" data-act="${act}" data-k="${k}" ${S.level<B.lv?'disabled':''}>${lockb(B.lv)}
  <span class="pic">${spr(k)}</span><b>${B.n}</b><small>${B.cost.toLocaleString()}G${B.t?' · 공사 '+fmt(B.t):''}</small>
  <span class="earn">${earn}</span></button>`}
function plotCard(here){const n=cnt(T=>T.t==='plot');
  return`<button class="card" data-act="plow" data-here="${here?1:''}" ${n>=plotCap()?'disabled':''}><span class="pic">${spr('plot')}</span><b>밭</b><small>${PLOT_COST}G</small><span class="earn">${n} / ${plotCap()}개</span></button>`}
const info=(pic,lines,btns='')=>`<div class="info"><div class="pic">${pic}</div><div class="txt">${lines}<div class="row">${btns}</div></div></div>`;
function mojoBtn(T){const c=mojoCost(remainOf(T));return`<button class="btn m" data-act="mojo" data-k="${c}" ${S.mojo<c?'disabled':''}>모조 ${c}개로 바로 완성</button>`}
const editBtns=(B)=>`<button class="btn w" data-act="move">옮기기</button><button class="btn w" data-act="sell">팔기 +${Math.floor(B.cost/4)}G</button>`;

const TABS=[['farm','농사'],['house','집'],['shop','가게'],['deco','장식']];
function openShop(here){
  const items=shopTab==='farm'?plotCard(here):Object.keys(BUILDS).filter(k=>BUILDS[k].cat===shopTab).map(k=>bldCard(k,here?'buildHere':'place')).join('');
  openSheet(here?'여기에 무엇을 지을까요?':'상점',`<div class="tabs">${TABS.map(([k,n])=>`<button class="tab ${shopTab===k?'on':''}" data-act="tab" data-k="${k}" data-here="${here?1:''}">${n}</button>`).join('')}</div><div class="cards">${items}</div>`);
}
function openSeeds(){openSheet('무엇을 심을까요?',`<div class="cards">${Object.keys(CROPS).map(cropCard).join('')}</div>`)}
function openGrowing(){const T=S.tiles[sel],C=CROPS[T.crop];
  openSheet(`${C.n} 자라는 중`,info(spr(T.crop),`<span class="big">남은 시간</span><span id="live"></span><span class="sub">다 자란 뒤 오래 두면 시들어요</span>`,
  mojoBtn(T)+`<button class="btn w" data-act="clear">뽑아내기</button>`),()=>remain(T.readyAt-S.gt))}
function openBuilding(){const T=S.tiles[sel],B=BUILDS[T.b];
  openSheet(`${B.n} 공사 중`,info(spr('build'),`<span class="big">완성까지</span><span id="live"></span>`,mojoBtn(T)),()=>remain(T.doneAt-S.gt))}
function openTax(){const T=S.tiles[sel],B=BUILDS[T.b];
  openSheet(B.n,info(spr(T.b),`<span class="sub">${B.d}</span><span class="big">다음 세금 +${B.g}G</span><span id="live"></span>`,mojoBtn(T)+editBtns(B)),()=>remain(T.taxAt-S.gt))}
function openJob(){const T=S.tiles[sel],B=BUILDS[T.b];
  openSheet(`${B.n} · 영업 중`,info(spr(T.b),`<span class="big">${B.item}</span><span class="sub">만드는 데 ${fmt(B.jt)} · 완성하면 +${B.g}G, +${B.jx}XP</span>`,
   `<button class="btn g" data-act="job">일 시작하기</button>`+editBtns(B)))}
function openWorking(){const T=S.tiles[sel],B=BUILDS[T.b];
  openSheet(`${B.n} · ${B.item} 만드는 중`,info(spr(T.b),`<span class="big">완성까지</span><span id="live"></span>`,mojoBtn(T)),()=>remain(T.job.doneAt-S.gt))}
function openDeco(){const T=S.tiles[sel],B=BUILDS[T.b];
  openSheet(B.n,info(spr(T.b),`<span class="sub">${B.d}</span>`,editBtns(B)))}
function openCastle(){
  const n=LANDS[S.land+1];
  openSheet(S.name,`${info(castleSvg(castleTier()),`<span class="big">${LANDS[S.land].n} · 레벨 ${S.level}</span><span class="sub">다음 레벨까지 ${(lvXp(S.level+1)-S.xp).toLocaleString()} XP · 밭 ${cnt(T=>T.t==='plot')}/${plotCap()}</span>`,
   n?`<button class="btn y" data-act="expand" ${S.level<n.lv||S.gold<n.cost?'disabled':''}>${n.n!==LANDS[S.land].n?ro(n.n)+' 업그레이드':'땅 넓히기'} · ${n.cost.toLocaleString()}G${S.level<n.lv?' (Lv.'+n.lv+')':''}</button>`:'<span class="sub">지금은 여기까지 넓힐 수 있어요</span>')}
   <p class="sec">모조 얻는 법</p><ul class="list"><li>매일 처음 들어오면 출석 선물 +2</li><li>레벨이 오를 때마다 +3~10</li><li>가끔 왕국에 떨어지는 반짝별을 누르면 +1</li></ul>`)}
function openExpand(){const n=LANDS[S.land+1];if(!n)return;
  openSheet('땅 넓히기',info(spr('land'),`<span class="big">${n.w}×${n.h} 크기로 넓혀요</span><span class="sub">레벨 ${n.lv} 이상 · ${n.cost.toLocaleString()}G</span>`,
  `<button class="btn y" data-act="expand" ${S.level<n.lv||S.gold<n.cost?'disabled':''}>넓히기</button>`))}
function openDev(){
  const sp=[1,DEV_SPEED,60,600].map(v=>`<button class="btn ${S.speed===v?'m':'w'}" data-act="speed" data-k="${v}">×${v}</button>`).join('');
  openSheet(`테스트 모드 · ${VERSION}`,`<p class="sec" style="margin-top:0">시간 속도 (×1 = 리얼타임)</p><div class="row">${sp}</div>
   <p class="sec">자원</p><div class="row"><button class="btn y" data-act="gold">골드 +1000</button><button class="btn m" data-act="mojo5">모조 +5</button><button class="btn" data-act="lvup">레벨 +1</button></div>
   <p class="sec">이벤트</p><div class="row"><button class="btn w" data-act="starNow">반짝별 부르기</button><button class="btn w" data-act="daily">출석 선물 다시 받기</button><button class="btn w" data-act="skip">1시간 건너뛰기</button><button class="btn w" data-act="skipGoal">튜토리얼 건너뛰기</button></div>
   <p class="sec">처음부터</p><div class="row"><button class="btn" data-act="reset">왕국 초기화</button></div>`)}
function openMe(){
  openSheet(S.name,info(spr(S.ruler),`<span class="big">${RULERS.find(x=>x.k===S.ruler).n} 폐하의 왕국</span><span class="sub">레벨 ${S.level} · 경험치 ${S.xp.toLocaleString()} · ${Math.floor(S.gt/DAY)+1}일차</span>`,
  `<button class="btn w" data-act="howto">튜토리얼 목표 보기</button>`))}

$('sheet').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.k,b)});
function act(a,k,b){
  const T=S.tiles[sel];
  switch(a){
   case'tab':shopTab=k;openShop(!!b.dataset.here);return;
   case'plow':if(b.dataset.here){if(makePlot(sel))closeSheet()}else{startPlacing({kind:'plot'});return}break;
   case'plant':{const C=CROPS[k];if(!pay(C.cost))return;Object.assign(T,{crop:k,plantedAt:S.gt,readyAt:S.gt+C.t});
     pop(sel,C.cost?`-${C.cost}`:'심었어요',C.cost?'gd':'');closeSheet();break}
   case'buildHere':if(doBuild(sel,k))closeSheet();break;
   case'place':startPlacing({kind:'new',k});return;
   case'mojo':{const c=+k;if(S.mojo<c){toast('모조가 모자라요');return}S.mojo-=c;S.st.mojo++;finishNow(T);pop(sel,'뿅! 완성','mj');closeSheet();break}
   case'job':{const B=BUILDS[T.b];T.job={startAt:S.gt,doneAt:S.gt+B.jt};pop(sel,'일 시작!');closeSheet();break}
   case'clear':T.crop=null;closeSheet();break;
   case'move':startPlacing({kind:'move',from:sel});return;
   case'sell':{const B=BUILDS[T.b];S.gold+=Math.floor(B.cost/4);pop(sel,`+${Math.floor(B.cost/4)}`,'gd');S.tiles[sel]={t:'grass'};syncWalkers();closeSheet();break}
   case'expand':{const n=LANDS[S.land+1];if(!n||S.level<n.lv)return;if(!pay(n.cost))return;
     const up=n.n!==LANDS[S.land].n;S.land++;S.st.expand++;gainXP(Math.round(n.cost/20));toast(up?`${ro(n.n)} 업그레이드했어요!`:'왕국이 넓어졌어요!');if(up)confetti();closeSheet();resize();break}
   case'howto':closeSheet();{const g=goalNow();say([{t:g?g.d:'튜토리얼은 모두 끝났어요. 마음껏 왕국을 키워보세요!',btn:'알겠어요'}])}return;
   case'speed':S.speed=+k;save();render();openDev();return;
   case'gold':S.gold+=1000;break;
   case'mojo5':S.mojo+=5;break;
   case'lvup':gainXP(lvXp(S.level+1)-S.xp);closeSheet();break;
   case'starNow':S.star=null;S.nextStar=S.gt;starTick();closeSheet();toast('반짝별이 떨어졌어요! 찾아서 눌러보세요');break;
   case'daily':S.daily='';checkDaily();break;
   case'skip':S.gt+=H;starTick();toast('1시간이 지났어요');break;
   case'skipGoal':setGoal(GOALS.length);closeSheet();toast('튜토리얼을 건너뛰었어요');break;
   case'reset':if(!resetArm){resetArm=true;b.textContent='한 번 더 누르면 초기화';return}
     try{localStorage.removeItem(KEY)}catch(e){}S=fresh();closeSheet();syncWalkers();resize();render();showIntro();return;
  }
  save();render();
}

/* ===== 배치 모드 ===== */
function startPlacing(p){placing=p;closeSheet();
  const nm=p.kind==='plot'?'밭':p.kind==='move'?BUILDS[S.tiles[p.from].b].n:BUILDS[p.k].n;
  $('placeTxt').textContent=p.kind==='move'?`${nm}을(를) 옮길 풀밭을 눌러주세요`:`${nm} 놓을 풀밭을 눌러주세요`+(p.kind==='plot'||BUILDS[p.k]?.cat==='deco'?' · 여러 개 가능':'');
  $('placeBar').hidden=false;render()}
function stopPlacing(){placing=null;$('placeBar').hidden=true}
$('placeCancel').onclick=()=>{stopPlacing();render()};
function placeAt(i){
  const p=placing;
  if(p.kind==='plot'){if(!makePlot(i))stopPlacing()}
  else if(p.kind==='move'){S.tiles[i]=S.tiles[p.from];S.tiles[p.from]={t:'grass'};pop(i,'옮겼어요');stopPlacing()}
  else{const ok=doBuild(i,p.k);if(!ok||BUILDS[p.k].cat!=='deco')stopPlacing()}
  save();render();
}

/* ===== 탭 ===== */
board.addEventListener('click',e=>{const t=e.target.closest('.tile,.castle');if(t)tap(+t.dataset.i)});
function tap(i){
  if(talking)return;
  const c=i%COLS,r=(i/COLS)|0;sel=i;
  if(!unlocked(c,r)){stopPlacing();render();return openExpand()}
  const T=S.tiles[i];
  if(S.star&&S.star.i===i){
    S.star=null;S.mojo++;S.nextStar=S.gt+rnd(H,3*H);pop(i,'모조 +1','mj');toast('반짝별을 잡았어요! 모조 +1');save();render();return}
  if(placing){if(T.t==='grass')placeAt(i);else toast('빈 풀밭을 눌러주세요');return}
  if(T.t==='grass'){if(goalNow()?.k==='plots')shopTab='farm';return openShop(true)}
  if(T.t==='castle')return openCastle();
  if(T.t==='plot'){const s=cropState(T);
    if(s==='empty')return openSeeds();
    if(s==='ready'){harvest(i);save();render();return}
    if(s==='dead'){T.crop=null;pop(i,'시든 작물 정리');save();render();return}
    return openGrowing()}
  const s=bldState(T);
  if(s==='build')return openBuilding();
  if(s==='tax'){collectTax(i);save();render();return}
  if(s==='done'){collectJob(i);save();render();return}
  if(s==='open')return openJob();
  if(s==='work')return openWorking();
  if(s==='idle')return openTax();
  return openDeco();
}
$('allBtn').onclick=collectAll;
$('shopBtn').onclick=()=>{if(talking)return;stopPlacing();if(goalNow()?.k==='pine')shopTab='deco';if(goalNow()?.k==='cottage')shopTab='house';openShop(false)};
$('devBtn').onclick=openDev;
$('meBtn').onclick=openMe;
$('devBtn').hidden=!DEV;
$('icGold').innerHTML=spr('coin');$('icMojo').innerHTML=spr('mojo');$('hand').innerHTML=spr('hand');

/* ===== 오프닝 ===== */
function showIntro(){
  const el=$('intro');el.hidden=false;
  el.innerHTML=`<h1>말랑 왕국</h1><div class="art">${castleSvg(2)}</div><p>작은 왕국을 말랑말랑 키워봐요</p><button class="btn big" id="goStart">시작하기</button><small style="color:var(--ink-soft)">${VERSION}</small>`;
  $('goStart').onclick=pickRuler;
}
function pickRuler(){
  const el=$('intro');
  el.innerHTML=`<p style="font-size:22px">누가 왕국을 다스릴까요?</p><div class="rulers">${RULERS.map(r=>`<button class="ruler ${S.ruler===r.k?'on':''}" data-k="${r.k}">${spr(r.k)}${r.n}</button>`).join('')}</div><button class="btn big" id="goName">다음</button>`;
  el.querySelectorAll('.ruler').forEach(b=>b.onclick=()=>{S.ruler=b.dataset.k;el.querySelectorAll('.ruler').forEach(x=>x.classList.toggle('on',x===b))});
  $('goName').onclick=pickName;
}
function pickName(){
  const el=$('intro');
  el.innerHTML=`<div class="art" style="width:110px;height:110px">${spr(S.ruler)}</div><p style="font-size:22px">왕국 이름을 지어주세요</p><input class="namein" id="nameIn" maxlength="10" value="${S.name}" aria-label="왕국 이름"><button class="btn big" id="goPlay">건국하기!</button>`;
  $('goPlay').onclick=()=>{const v=$('nameIn').value.trim();S.name=v||'말랑 왕국';S.started=true;setGoal(0);el.hidden=true;checkDaily();save();render();
    const who=RULERS.find(x=>x.k===S.ruler).n;
    say([{t:`어서 오세요, ${who} 폐하! 저는 이 나라의 대신 몽실이에요.`},
         {t:`${S.name}은 아직 작고 조용하지만, 폐하와 함께라면 금방 북적북적해질 거예요.`},
         {t:'건국 기념으로 모조 10개를 드릴게요. 모조를 쓰면 기다리지 않고 바로 완성할 수 있어요.',extra:'<div class="reward"><span>모조 10</span></div>'},
         {t:GOALS[0].d,btn:'해볼게요!'}]);
  };
}

/* ===== 시계 ===== */
let lastSave=0;
function tick(){
  const now=Date.now();S.gt+=Math.max(0,(now-S.real)/1000)*S.speed;S.real=now;
  starTick();render();tickLive();updateHand();walkTick();
  if(now-lastSave>2000){save();syncWalkers();lastSave=now}
}
resize();syncWalkers();render();
if(!S.started)showIntro();else checkDaily();
setInterval(tick,200);
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script>
